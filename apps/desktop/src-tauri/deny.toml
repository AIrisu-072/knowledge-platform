# Policy for the desktop shell's own lockfile only (separate Cargo workspace).
# The root deny.toml is unchanged and still governs every server/runtime crate.
# Owner approval 2026-10-07: docs/decisions/2026-10-07-tauri-v2-desktop-qualification.md
# Run from this directory: cargo deny check

[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # gtk3-rs 0.18 (the Linux GTK/WebKitGTK backend of wry/tao/muda) still uses
  # this unmaintained proc-macro at build time. Linux use approved by the
  # owner; no known vulnerability. Re-evaluate when Tauri moves to gtk4/glib 0.20.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4: unmaintained build-time proc-macro of gtk3-rs 0.18 (Linux desktop only); owner-approved 2026-10-07" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The broker is a path dependency of this private (publish = false) crate.
allow-wildcard-paths = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# MPL-2.0 (file-level copyleft), exact versions only, owner-approved for this
# lockfile on 2026-10-07. Unmodified upstream sources; notice in THIRD_PARTY_NOTICES.md.
[[licenses.exceptions]]
name = "option-ext"
version = "0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser"
version = "0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "0.3.5"
allow = ["MPL-2.0"]

# Linux host build only (system-deps -> cfg-expr). The LLVM exception only
# adds permissions to Apache-2.0, which is already allowed.
[[licenses.exceptions]]
name = "target-lexicon"
version = "0.12.16"
allow = ["Apache-2.0 WITH LLVM-exception"]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
