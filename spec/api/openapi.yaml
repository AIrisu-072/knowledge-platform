openapi: 3.2.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Knowledge Platform Document API
  version: 0.1.0
  description: One authorized Document API for human, agent and CLI clients. Identity is established only by a trusted
    adapter; request data never supplies the actor.
servers:
- url: /
  description: Same-origin deployment; no production endpoint is fixed.
x-error-registry: ../errors/error-registry.yaml
paths:
  /v1/session:
    get:
      tags:
      - Session
      summary: Read the verified current session
      operationId: getSession
      description: >-
        Returns the actor verified by the trusted identity adapter. Request headers
        and query parameters cannot replace the verified principal. Identity
        presentation is resolved separately and falls back to the stable subject ID.
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents:
    get:
      tags:
      - Documents
      summary: List documents by authorized view
      operationId: listDocuments
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application. projection=display adds bounded source-located fragments and pageSize/cursor without changing semantic verdict or coverage.
      responses:
        '200':
          $ref: '#/components/responses/DocumentList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/view'
      - $ref: '#/components/parameters/titleContains'
      - $ref: '#/components/parameters/queryFolderId'
      - $ref: '#/components/parameters/includeDescendants'
      - $ref: '#/components/parameters/documentType'
      - $ref: '#/components/parameters/owningDepartment'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/createdFrom'
      - $ref: '#/components/parameters/createdBefore'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/unreadOnly'
    post:
      tags:
      - Documents
      summary: Create initial document and primary file
      operationId: createDocument
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '201':
          $ref: '#/components/responses/CreateDocumentResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/CreateDocumentMultipart'
  /v1/document-creation-outcomes/{documentId}:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - Documents
      summary: Recover an initial document creation outcome
      operationId: recoverDocumentCreation
      description: All generated IDs must match and current authoring authorization is re-evaluated before disclosure.
      parameters:
      - name: documentVersionId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: fileId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          $ref: '#/components/responses/CreateDocumentResult'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{documentId}:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - Documents
      summary: Read document by authorized view
      operationId: getDocument
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/DocumentDetail'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/detailView'
  /v1/documents/{documentId}/versions:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - Versions
      summary: List authorized versions
      operationId: listDocumentVersions
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/VersionList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/purpose'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/cursor'
    post:
      tags:
      - Versions
      summary: Create a working version
      operationId: createDocumentVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '201':
          $ref: '#/components/responses/VersionMutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/VersionMultipart'
  /v1/documents/{documentId}/versions/{versionId}:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    get:
      tags:
      - Versions
      summary: Read an authorized version
      operationId: getDocumentVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/purpose'
    put:
      tags:
      - Versions
      summary: Update a working version
      operationId: updateWorkingVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/VersionMutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/VersionMultipart'
  /v1/documents/{documentId}/revisions:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - History
      summary: List human-facing document revisions
      operationId: listDocumentRevisions
      description: Newest-first keyset pagination. Current Read and ReadHistory authorization is checked on every request.
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRevisionPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{documentId}/revisions/{revisionId}:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/revisionId'
    get:
      tags:
      - History
      summary: Read a human-facing document revision
      operationId: getDocumentRevision
      description: Current Read and ReadHistory authorization is checked for each detail request.
      responses:
        '200':
          $ref: '#/components/responses/DocumentRevision'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{documentId}/versions/{versionId}:rebase:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    post:
      tags:
      - Versions
      summary: Rebase a working version
      operationId: rebaseWorkingVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/VersionMutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/RebaseVersion'
  /v1/documents/{documentId}/versions/{versionId}:publish:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    post:
      tags:
      - Lifecycle
      summary: Publish a version
      operationId: publishVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/PublishResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/PublishVersion'
  /v1/documents/{documentId}/versions/{versionId}:withdraw:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    post:
      tags:
      - Lifecycle
      summary: Withdraw a version
      operationId: withdrawVersion
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/WithdrawResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/WithdrawVersion'
  /v1/documents/{documentId}/versions/{versionId}:schedule-publication:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    post:
      tags:
      - Lifecycle
      summary: Schedule version publication
      operationId: schedulePublication
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/SchedulePublicationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/SchedulePublication'
  /v1/documents/{documentId}/versions/{versionId}:cancel-publication-schedule:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    post:
      tags:
      - Lifecycle
      summary: Cancel a publication schedule
      operationId: cancelPublicationSchedule
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/CancelPublicationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/CancelPublicationSchedule'
  /v1/documents/{documentId}:end-publication:
    parameters:
    - $ref: '#/components/parameters/documentId'
    post:
      tags:
      - Lifecycle
      summary: End publication without fallback
      operationId: endDocumentPublication
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/EndPublicationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/EndPublication'
  /v1/documents/{documentId}/metadata:
    parameters:
    - $ref: '#/components/parameters/documentId'
    patch:
      tags:
      - Management
      summary: Set and unset document metadata
      operationId: patchDocumentMetadata
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/MetadataPatch'
  /v1/documents/{documentId}:move:
    parameters:
    - $ref: '#/components/parameters/documentId'
    post:
      tags:
      - Management
      summary: Move a document
      operationId: moveDocument
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/MoveDocument'
  /v1/documents/{documentId}/access-policy:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - Policy
      summary: Read local and effective document policy with administer permission
      operationId: getDocumentAccessPolicy
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/AccessPolicyRead'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Policy
      summary: Set document policy
      operationId: setDocumentAccessPolicy
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/SetAccessPolicy'
  /v1/documents/{documentId}/versions/{versionId}/read-state:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    put:
      tags:
      - ReadState
      summary: Explicit HumanInteractive read confirmation
      operationId: markDocumentVersionRead
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/ReadStateResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{documentId}/history:
    parameters:
    - $ref: '#/components/parameters/documentId'
    get:
      tags:
      - History
      summary: Read authorized document history
      operationId: getDocumentHistory
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/History'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/cursor'
  /v1/documents/{documentId}/versions/{versionId}/edit-manifest:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    get:
      tags:
      - Files
      summary: Read the complete exact manifest for editing
      operationId: getVersionEditManifest
      description: Requires current Read+Write and the existing published or authoring lifecycle authorization. Returns document revision, source version, title and every item/representation from the same snapshot. Published requires the current published version; authoring requires WORKING. History purpose and implicit history fallback are forbidden. This metadata read does not replace the separately authorized, audited binary download.
      parameters:
      - name: purpose
        in: query
        required: true
        description: Exact editing source authorization purpose.
        schema:
          type: string
          enum: [published, authoring]
      responses:
        '200':
          $ref: '#/components/responses/EditManifest'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/documents/{documentId}/versions/{versionId}/files:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    get:
      tags:
      - Files
      summary: List authorized version files
      operationId: listVersionFiles
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/FileList'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/purpose'
  /v1/documents/{documentId}/versions/{versionId}/files/{contentItemId}/{representationId}:
    parameters:
    - $ref: '#/components/parameters/documentId'
    - $ref: '#/components/parameters/versionId'
    - $ref: '#/components/parameters/contentItemId'
    - $ref: '#/components/parameters/representationId'
    get:
      tags:
      - Files
      summary: Download only after authorization and Audit commit
      operationId: downloadVersionFile
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/BinaryDownload'
        '401':
          $ref: '#/components/responses/Problem'
        '416':
          description: Range requests are not supported in v0; no file bytes are returned.
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/purpose'
  /v1/documents/{documentId}/comparisons:
    parameters:
    - $ref: '#/components/parameters/documentId'
    post:
      tags:
      - Comparisons
      summary: Compare authorized version pair
      operationId: compareDocumentVersions
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/ComparisonResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/ComparisonRequest'
  /v1/documents/{documentId}/revision-comparisons:
    parameters:
    - $ref: '#/components/parameters/documentId'
    post:
      tags:
      - Comparisons
      summary: Compare authorized formal revision pair
      operationId: compareDocumentRevisions
      description: Compares revision metadata snapshots and reuses Document Diff only when their authoritative DocumentVersions differ. projection=display adds bounded source-located fragments and pageSize/cursor without changing semantic verdict or coverage.
      responses:
        '200':
          $ref: '#/components/responses/RevisionComparison'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/RevisionComparisonRequest'
  /v1/folders/root:
    get:
      tags:
      - Folders
      summary: Discover authorized root folder
      operationId: getRootFolder
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/Folder'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/folders/{folderId}/children:
    parameters:
    - $ref: '#/components/parameters/folderId'
    get:
      tags:
      - Folders
      summary: List visible direct children
      operationId: listFolderChildren
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/FolderChildren'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/cursor'
  /v1/folders:
    post:
      tags:
      - Folders
      summary: Create a folder with caller-fixed folder ID
      operationId: createFolder
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '201':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/CreateFolder'
  /v1/folders/{folderId}:
    parameters:
    - $ref: '#/components/parameters/folderId'
    patch:
      tags:
      - Folders
      summary: Rename a folder
      operationId: renameFolder
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/RenameFolder'
  /v1/folders/{folderId}:move:
    parameters:
    - $ref: '#/components/parameters/folderId'
    post:
      tags:
      - Folders
      summary: Move a folder
      operationId: moveFolder
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/MoveFolder'
  /v1/folders/{folderId}/access-policy:
    parameters:
    - $ref: '#/components/parameters/folderId'
    get:
      tags:
      - Policy
      summary: Read local and effective folder policy with administer permission
      operationId: getFolderAccessPolicy
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/AccessPolicyRead'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - Policy
      summary: Set folder policy
      operationId: setFolderAccessPolicy
      description: The trusted identity adapter supplies the verified actor. Authorization and Audit remain in Application.
      responses:
        '200':
          $ref: '#/components/responses/MutationResult'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        $ref: '#/components/requestBodies/SetAccessPolicy'
components:
  schemas:
    Uuid:
      $ref: ./schemas/common/identifiers.yaml#/$defs/Uuid
    Cursor:
      $ref: ./schemas/common/identifiers.yaml#/$defs/Cursor
    IdentityRef:
      $ref: ./schemas/document/models.yaml#/$defs/IdentityRef
    IdentityPresentation:
      $ref: ./schemas/document/models.yaml#/$defs/IdentityPresentation
    Session:
      $ref: ./schemas/document/models.yaml#/$defs/Session
    FieldError:
      $ref: ./schemas/errors/field-error.yaml
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine code from spec/errors/error-registry.yaml.
        traceId:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        recovery:
          $ref: '#/components/schemas/CreateRecovery'
        exactRetry:
          type: boolean
          description: Only the same operation ID and payload may be retried.
    CreateRecovery:
      type: object
      additionalProperties: false
      required:
      - documentId
      - documentVersionId
      - fileId
      - recoveryEndpoint
      properties:
        documentId:
          $ref: '#/components/schemas/Uuid'
        documentVersionId:
          $ref: '#/components/schemas/Uuid'
        fileId:
          $ref: '#/components/schemas/Uuid'
        recoveryEndpoint:
          type: string
          format: uri-reference
    PublishedDocument:
      $ref: ./schemas/document/models.yaml#/$defs/PublishedDocument
    AuthoringDocument:
      $ref: ./schemas/document/models.yaml#/$defs/AuthoringDocument
    HistoryDocument:
      $ref: ./schemas/document/models.yaml#/$defs/HistoryDocument
    DocumentList:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentList
    GuiVersionSummary:
      $ref: ./schemas/document/models.yaml#/$defs/GuiVersionSummary
    DocumentRevisionSummary:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentRevisionSummary
    DocumentRevisionPage:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentRevisionPage
    DocumentRevisionDetail:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentRevisionDetail
    DocumentDetail:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentDetail
    ActionAvailability:
      $ref: ./schemas/document/models.yaml#/$defs/ActionAvailability
    DocumentCapabilities:
      $ref: ./schemas/document/models.yaml#/$defs/DocumentCapabilities
    VersionCapabilities:
      $ref: ./schemas/document/models.yaml#/$defs/VersionCapabilities
    FolderCapabilities:
      $ref: ./schemas/document/models.yaml#/$defs/FolderCapabilities
    Version:
      $ref: ./schemas/document/models.yaml#/$defs/Version
    VersionDetail:
      $ref: ./schemas/document/models.yaml#/$defs/VersionDetail
    VersionList:
      $ref: ./schemas/document/models.yaml#/$defs/VersionList
    History:
