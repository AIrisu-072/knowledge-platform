$defs:
  PublishedDocument:
    type: object
    additionalProperties: false
    required: [documentId, documentVersionId, title, folderId, currentVersionId, revision, displayVersion, displayRevision, readState, displayTimestamp]
    properties:
      documentId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      title: {type: string}
      folderId: {type: [string, 'null'], format: uuid}
      folderName: {type: [string, 'null']}
      currentVersionId: {type: string, format: uuid}
      revision: {type: integer, minimum: 0}
      unread: {type: boolean}
      metadata: {type: object}
      createdAt: {type: string, format: date-time}
      publishedAt: {type: string, format: date-time}
      firstReadAt: {type: [string, 'null'], format: date-time}
      displayVersion: {$ref: '#/$defs/GuiVersionSummary'}
      displayRevision: {oneOf: [{$ref: '#/$defs/DocumentRevisionSummary'}, {type: 'null'}]}
      readState: {$ref: '#/$defs/GuiReadState'}
      displayTimestamp: {$ref: '#/$defs/GuiDisplayTimestamp'}
  AuthoringDocument:
    type: object
    additionalProperties: false
    required: [documentId, documentVersionId, title, lifecycleState, folderId, revision, currentVersionId, displayVersion, displayRevision, readState, displayTimestamp]
    properties:
      documentId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      title: {type: string}
      lifecycleState: {type: string, enum: [working, published, withdrawn]}
      folderId: {type: [string, 'null'], format: uuid}
      folderName: {type: [string, 'null']}
      revision: {type: integer, minimum: 0}
      currentVersionId: {type: [string, 'null'], format: uuid}
      metadata: {type: object}
      createdAt: {type: string, format: date-time}
      displayVersion: {$ref: '#/$defs/GuiVersionSummary'}
      displayRevision: {oneOf: [{$ref: '#/$defs/DocumentRevisionSummary'}, {type: 'null'}]}
      readState: {$ref: '#/$defs/GuiReadState'}
      displayTimestamp: {$ref: '#/$defs/GuiDisplayTimestamp'}
  HistoryDocument:
    type: object
    additionalProperties: false
    required: [documentId, documentVersionId, title, lifecycleState, ended, folderId, revision, displayVersion, displayRevision, readState, displayTimestamp]
    properties:
      documentId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      title: {type: string}
      lifecycleState: {type: string, enum: [working, published, withdrawn]}
      ended: {type: boolean}
      folderId: {type: [string, 'null'], format: uuid}
      folderName: {type: [string, 'null']}
      revision: {type: integer, minimum: 0}
      metadata: {type: object}
      createdAt: {type: string, format: date-time}
      displayVersion: {$ref: '#/$defs/GuiVersionSummary'}
      displayRevision: {oneOf: [{$ref: '#/$defs/DocumentRevisionSummary'}, {type: 'null'}]}
      readState: {$ref: '#/$defs/GuiReadState'}
      displayTimestamp: {$ref: '#/$defs/GuiDisplayTimestamp'}
  DocumentList:
    oneOf:
      - type: object
        additionalProperties: false
        required: [view, items, nextCursor]
        properties:
          view: {const: published}
          items: {type: array, items: {$ref: '#/$defs/PublishedDocument'}}
          nextCursor: {type: [string, 'null']}
      - type: object
        additionalProperties: false
        required: [view, items, nextCursor]
        properties:
          view: {const: authoring}
          items: {type: array, items: {$ref: '#/$defs/AuthoringDocument'}}
          nextCursor: {type: [string, 'null']}
      - type: object
        additionalProperties: false
        required: [view, items, nextCursor]
        properties:
          view: {const: history}
          items: {type: array, items: {$ref: '#/$defs/HistoryDocument'}}
          nextCursor: {type: [string, 'null']}
  DocumentDetail:
    oneOf:
      - $ref: '#/$defs/PublishedDocument'
      - $ref: '#/$defs/AuthoringDocument'
  GuiVersionSummary:
    type: object
    additionalProperties: false
    required: [versionId, versionNo, baseVersionId, lifecycleState, isCurrent, approvedAt, scheduledPublishAt, publishedAt, withdrawnAt, updatedAt, fileSummary]
    properties:
      versionId: {type: string, format: uuid}
      versionNo: {type: integer, minimum: 1}
      baseVersionId: {type: [string, 'null'], format: uuid}
      lifecycleState: {type: string, enum: [WORKING, PUBLISHED, WITHDRAWN]}
      isCurrent: {type: boolean}
      approvedAt: {type: [string, 'null'], format: date-time}
      scheduledPublishAt: {type: [string, 'null'], format: date-time}
      publishedAt: {type: [string, 'null'], format: date-time}
      withdrawnAt: {type: [string, 'null'], format: date-time}
      updatedAt: {type: string, format: date-time}
      fileSummary: {$ref: '#/$defs/VersionFileSummary'}
  VersionFileSummary:
    type: object
    additionalProperties: false
    required: [authoritativeItemCount, totalSizeBytes, primary]
    properties:
      authoritativeItemCount: {type: integer, minimum: 0}
      totalSizeBytes: {type: integer, minimum: 0}
      primary: {oneOf: [{$ref: '#/$defs/PrimaryFileSummary'}, {type: 'null'}]}
  PrimaryFileSummary:
    type: object
    additionalProperties: false
    required: [displayName, mediaType, sizeBytes]
    properties:
      displayName: {type: string}
      mediaType: {type: string}
      sizeBytes: {type: integer, minimum: 0}
  GuiReadState:
    type: object
    additionalProperties: false
    required: [isRead, firstReadAt]
    properties:
      isRead: {type: boolean}
      firstReadAt: {type: [string, 'null'], format: date-time}
  GuiDisplayTimestamp:
    type: object
    additionalProperties: false
    required: [kind, value]
    properties:
      kind: {type: string, enum: [revisionCreatedAt, workingUpdatedAt]}
      value: {type: string, format: date-time}
  DocumentRevisionSummary:
    type: object
    additionalProperties: false
    required: [revisionId, documentVersionId, major, minor, label, createdAt, sourceKind, metadataSnapshotStatus]
    properties:
      revisionId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      major: {type: integer, minimum: 1}
      minor: {type: integer, minimum: 0}
      label: {type: string}
      createdAt: {type: string, format: date-time}
      sourceKind: {type: string, enum: [initialPublication, contentPublication, metadataRevision, withdrawFallback, legacyBackfill]}
      metadataSnapshotStatus: {type: string, enum: [complete, unavailableLegacy]}
  DocumentRevisionPage:
    type: object
    additionalProperties: false
    required: [items, nextCursor]
    properties:
      items: {type: array, items: {$ref: '#/$defs/DocumentRevisionSummary'}}
      nextCursor: {type: [string, 'null']}
  DocumentRevisionDetail:
    type: object
    additionalProperties: false
    required: [revisionId, documentVersionId, major, minor, label, createdAt, sourceKind, metadataSnapshotStatus, metadataSnapshot, actor, reason]
    properties:
      revisionId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      major: {type: integer, minimum: 1}
      minor: {type: integer, minimum: 0}
      label: {type: string}
      createdAt: {type: string, format: date-time}
      sourceKind: {type: string, enum: [initialPublication, contentPublication, metadataRevision, withdrawFallback, legacyBackfill]}
      metadataSnapshotStatus: {type: string, enum: [complete, unavailableLegacy]}
      metadataSnapshot: {type: [object, 'null']}
      actor:
        oneOf:
        - type: object
          additionalProperties: false
          required: [identityProvider, principalId]
          properties:
            identityProvider: {type: string, minLength: 1}
            principalId: {type: string, minLength: 1}
        - type: 'null'
      reason: {type: [string, 'null']}
  Version:
    type: object
    additionalProperties: false
    required: [versionId, versionNo, baseVersionId, lifecycleState, isCurrent, createdAt, approvedAt, scheduledPublishAt, publishedAt, withdrawnAt, updatedAt, fileSummary, firstReadAt]
    properties:
      versionId: {type: string, format: uuid}
      versionNo: {type: integer, minimum: 1}
      baseVersionId: {type: [string, 'null'], format: uuid}
      lifecycleState: {type: string, enum: [working, published, withdrawn]}
      isCurrent: {type: boolean}
      createdAt: {type: string, format: date-time}
      approvedAt: {type: [string, 'null'], format: date-time}
      scheduledPublishAt: {type: [string, 'null'], format: date-time}
      publishedAt: {type: [string, 'null'], format: date-time}
      withdrawnAt: {type: [string, 'null'], format: date-time}
      updatedAt: {type: string, format: date-time}
      fileSummary: {$ref: '#/$defs/VersionFileSummary'}
      firstReadAt: {type: [string, 'null'], format: date-time}
      title: {type: string}
      metadata: {type: object}
  VersionList:
    type: object
    additionalProperties: false
    required: [items, nextCursor]
    properties:
      items: {type: array, items: {$ref: '#/$defs/Version'}}
      nextCursor: {type: [string, 'null']}
  History:
    type: object
    additionalProperties: false
    required: [items, nextCursor]
    properties:
      nextCursor: {type: [string, 'null']}
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [sourceKind, sourceKey, occurredAt, actionCode, details, provenanceQuality]
          properties:
            sourceKind: {type: string}
            sourceKey: {type: string}
            occurredAt: {type: [string, 'null'], format: date-time}
            actionCode: {type: string}
            details: {type: object}
            provenanceQuality: {type: string, enum: [operationLedger, versionFallback, legacyUnknown]}
            actor:
              type: [object, 'null']
              properties:
                identityProvider: {type: string}
                principalId: {type: string}
  FileList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [contentItemId, representationId, logicalPath, ordinal, role, displayName, mediaType, sizeBytes]
          properties:
            contentItemId: {type: string, format: uuid}
            representationId: {type: string, format: uuid}
            logicalPath: {type: string}
            ordinal: {type: integer, minimum: 0}
            role: {type: string}
            displayName: {type: string}
            mediaType: {type: string}
            sizeBytes: {type: integer, minimum: 0}
  Folder:
    type: object
    additionalProperties: false
    required: [folderId, name, revision]
    properties:
      folderId: {type: string, format: uuid}
      name: {type: string}
      revision: {type: integer, minimum: 0}
      parentFolderId: {type: [string, 'null'], format: uuid}
  FolderChildren:
    type: object
    additionalProperties: false
    required: [items, nextCursor]
    properties:
      items: {type: array, items: {$ref: '#/$defs/Folder'}}
      nextCursor: {type: [string, 'null']}
  PolicyTarget:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: {type: string, enum: [document, folder]}
      id: {type: string, format: uuid}
  AccessPolicyRead:
    type: object
    additionalProperties: false
    required: [target, bindingMode, policyId, policyRevision, effectivePolicyId, effectiveSource, effectiveGrants]
    properties:
      target: {$ref: '#/$defs/PolicyTarget'}
      bindingMode: {type: string, enum: [inherit, explicit]}
      policyId: {type: [string, 'null'], format: uuid}
      policyRevision: {type: integer, minimum: 0}
      effectivePolicyId: {type: string, format: uuid}
      effectiveSource: {$ref: '#/$defs/PolicyTarget'}
      effectiveGrants:
        type: array
        items: {$ref: '#/$defs/PolicyGrant'}
  PolicyGrant:
    type: object
    additionalProperties: false
    required: [subjectKind, identityProvider, subjectId, actions]
    properties:
      subjectKind: {type: string, enum: [principal, group, role]}
      identityProvider: {type: string, minLength: 1}
      subjectId: {type: string}
      actions:
        type: array
        uniqueItems: true
        minItems: 1
        items: {type: string, enum: [read, readHistory, write, publish, administer]}
  CreateDocumentResult:
    type: object
    additionalProperties: false
    required: [documentId, documentVersionId, fileId]
    properties:
      documentId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      fileId: {type: string, format: uuid}
  MutationResult:
    type: object
    additionalProperties: false
    required: [operationId, resourceId, resultingRevision, changed, occurredAt]
    properties:
      operationId: {type: string, format: uuid}
      resourceId: {type: string, format: uuid}
      resultingRevision: {type: integer, minimum: 0}
      changed: {type: boolean}
      occurredAt: {type: string, format: date-time}
      auditEventId: {type: string, format: uuid}
  VersionMutationResult:
    type: object
    additionalProperties: false
    required: [operationId, documentId, targetVersionId, versionNo, baseVersionId, resultingRevision]
    properties:
      operationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      targetVersionId: {type: string, format: uuid}
      versionNo: {type: integer, minimum: 1}
      baseVersionId: {type: string, format: uuid}
      resultingRevision: {type: integer, minimum: 0}
  PublishResult:
    type: object
    additionalProperties: false
    required: [publishOperationId, documentId, documentVersionId, resultingDocumentRevision, publishedAt]
    properties:
      publishOperationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      documentVersionId: {type: string, format: uuid}
      resultingDocumentRevision: {type: integer, minimum: 0}
      publishedAt: {type: string, format: date-time}
  WithdrawResult:
    type: object
    additionalProperties: false
    required: [operationId, documentId, targetVersionId, formerCurrentVersionId, resultingCurrentVersionId, resultingRevision, restorationWithheldReason]
    properties:
      operationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      targetVersionId: {type: string, format: uuid}
      formerCurrentVersionId: {type: [string, 'null'], format: uuid}
      resultingCurrentVersionId: {type: [string, 'null'], format: uuid}
      resultingRevision: {type: integer, minimum: 0}
      restorationWithheldReason: {type: [string, 'null']}
  SchedulePublicationResult:
    type: object
    additionalProperties: false
    required: [publishOperationId, documentId, targetVersionId, acceptedRevision, scheduledPublishAt]
    properties:
      publishOperationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      targetVersionId: {type: string, format: uuid}
      acceptedRevision: {type: integer, minimum: 0}
      scheduledPublishAt: {type: string, format: date-time}
  CancelPublicationResult:
    type: object
    additionalProperties: false
    required: [operationId, publishOperationId, documentId, targetVersionId, resultingRevision]
    properties:
      operationId: {type: string, format: uuid}
      publishOperationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      targetVersionId: {type: string, format: uuid}
      resultingRevision: {type: integer, minimum: 0}
  EndPublicationResult:
    type: object
    additionalProperties: false
    required: [operationId, documentId, formerCurrentVersionId, resultingCurrentVersionId, resultingDocumentRevision, endedAt]
    properties:
      operationId: {type: string, format: uuid}
      documentId: {type: string, format: uuid}
      formerCurrentVersionId: {type: string, format: uuid}
      resultingCurrentVersionId: {type: 'null'}
      resultingDocumentRevision: {type: integer, minimum: 0}
      endedAt: {type: string, format: date-time}
  ReadStateResult:
    type: object
    additionalProperties: false
    required: [documentId, versionId, firstReadAt, inserted]
    properties:
      documentId: {type: string, format: uuid}
      versionId: {type: string, format: uuid}
      firstReadAt: {type: string, format: date-time}
      inserted: {type: boolean}
  SourceEvidence:
    type: object
    additionalProperties: false
    required: [documentId, versionId, contentItemId, representationId, fileId, rawSha256, inspectionProfile, locator, granularity, parserProvenance]
    properties:
      documentId: {type: string, format: uuid}
      versionId: {type: string, format: uuid}
      contentItemId: {type: string, format: uuid}
      representationId: {type: string, format: uuid}
      fileId: {type: string, format: uuid}
      rawSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      inspectionProfile: {type: string}
      locator: {$ref: '#/$defs/SourceLocator'}
      granularity: {type: string, enum: [exact, parent, contentItem]}
      parserProvenance: {type: string}
  SourceLocator:
    description: Navigation in the authoritative original; never a StorageKey.
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties: {kind: {const: contentItem}}
      - type: object
        additionalProperties: false
        required: [kind, line, byteStart, byteEnd]
        properties:
          kind: {const: textSpan}
          line: {type: integer, minimum: 1}
          byteStart: {type: integer, minimum: 0}
          byteEnd: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [kind, row, column]
        properties:
          kind: {const: csvCell}
          row: {type: integer, minimum: 1}
          column: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [kind, path]
        properties:
          kind: {const: htmlNode}
          path: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, path]
        properties:
          kind: {const: officePath}
          path: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, sheet, cell]
        properties:
          kind: {const: sheetCell}
          sheet: {type: string, minLength: 1}
          cell: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, module, procedure]
        properties:
          kind: {const: vbaModule}
          module: {type: string, minLength: 1}
          procedure: {type: [string, 'null']}
      - type: object
        additionalProperties: false
        required: [kind, slide, object]
        properties:
          kind: {const: slideObject}
          slide: {type: integer, minimum: 1}
          object: {type: [string, 'null']}
      - type: object
        additionalProperties: false
        required: [kind, page, region]
        properties:
          kind: {const: pdfPage}
          page: {type: integer, minimum: 1}
          region:
            oneOf:
              - type: 'null'
              - type: array
                prefixItems:
                  - {type: integer, minimum: 0}
                  - {type: integer, minimum: 0}
                  - {type: integer, minimum: 0}
                  - {type: integer, minimum: 0}
                minItems: 4
                maxItems: 4
  DiffChange:
    type: object
    additionalProperties: false
    required: [operation, relocation, facet, base, target, reasonCode]
    properties:
      operation: {type: [string, 'null'], enum: [added, removed, modified, null]}
      relocation: {type: [string, 'null'], enum: [moved, reordered, renamed, null]}
      facet: {type: string}
      base: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      target: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      reasonCode: {type: string}
  UnverifiedRegion:
    type: object
    additionalProperties: false
    required: [reason, base, target, navigationHint]
    properties:
      reason: {type: string, enum: [unsupportedSemanticConstruct, corruptedSource, missingInspectionEvidence, ambiguousAlignment, resourceLimit]}
      base: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      target: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      navigationHint: {type: [string, 'null']}
  AncillaryChange:
    type: object
    additionalProperties: false
    required: [kind, baseDigest, targetDigest]
    properties:
      kind: {type: string}
      baseDigest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
      targetDigest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
  ComparisonRow:
    type: object
    additionalProperties: false
    required: [state, facet, operation, relocation, base, target, reason, navigationHint]
    properties:
      state: {type: string, enum: [confirmed, unverified, ancillary]}
      facet: {type: string}
      operation: {type: [string, 'null'], enum: [added, removed, modified, null]}
      relocation: {type: [string, 'null'], enum: [moved, reordered, renamed, null]}
      base: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      target: {oneOf: [{$ref: '#/$defs/SourceEvidence'}, {type: 'null'}]}
      reason: {type: string}
      navigationHint: {type: [string, 'null']}
  DiffProjection:
    type: object
    additionalProperties: false
    required: [projection, verdict, coverage, resultDigest, changes, unverifiedRegions, ancillaryChanges, auditEventId]
    properties:
      projection: {const: diff}
      verdict: {type: string, enum: [same, different, unknown]}
      coverage: {type: string, enum: [full, partial, none]}
      resultDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      changes: {type: array, items: {$ref: '#/$defs/DiffChange'}}
      unverifiedRegions: {type: array, items: {$ref: '#/$defs/UnverifiedRegion'}}
      ancillaryChanges: {type: array, items: {$ref: '#/$defs/AncillaryChange'}}
      auditEventId: {type: string, format: uuid}
  ComparisonTableProjection:
    type: object
    additionalProperties: false
    required: [projection, verdict, coverage, resultDigest, rows, unverifiedRegions, auditEventId]
    properties:
      projection: {const: comparisonTable}
      verdict: {type: string, enum: [same, different, unknown]}
      coverage: {type: string, enum: [full, partial, none]}
      resultDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
      rows: {type: array, items: {$ref: '#/$defs/ComparisonRow'}}
      unverifiedRegions: {type: array, items: {$ref: '#/$defs/UnverifiedRegion'}}
      auditEventId: {type: string, format: uuid}
  ComparisonResponse:
    oneOf:
      - $ref: '#/$defs/DiffProjection'
      - $ref: '#/$defs/ComparisonTableProjection'
