version = 1

[repository]
required_files = [
  "spec/architecture/architecture-contract-v0.md",
  "spec/architecture/development-container-ci-architecture-v0.md",
  "spec/architecture/development-assurance-architecture-v0.md",
  "spec/operations/error-handling-resilience-requirements-v0.md",
  "spec/operations/observability-audit-requirements-v0.md",
  "spec/requirements/frontend-ux-requirements-v0.md",
  "spec/selection/library-tool-selection-v0.md",
  "mise.toml",
  "rust-toolchain.toml",
  ".github/workflows/ci.yml",
]
forbidden_top_level = [
  "Dockerfile.dev",
  "Dockerfile.test",
  "Dockerfile.ci",
  "Dockerfile.prod",
]

[platform]
production_target = "linux/amd64"
native_windows_supported = false

[ci]
allow_self_hosted = false
allow_native_windows = false
require_mise_entrypoint = true
require_workflow_permissions = true

[workspace]
allowed_production_roots = ["crates", "apps"]
tooling_root = "tools"

[workspace.boundaries.document_domain]
crate_path = "crates/document-domain"
forbidden_dependencies = ["sqlx", "axum", "tokio", "document-server"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.document_application]
crate_path = "crates/document-application"
forbidden_dependencies = ["sqlx", "axum", "document-server"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.document_api_http]
crate_path = "crates/document-api-http"
forbidden_dependencies = ["document-server", "sqlx", "document-repository-postgres", "document-storage-fs", "document-diff-runner", "document-semantic-inspection-runner"]
forbidden_source_patterns = ["document_repository_postgres", "document_storage_fs", "document_diff_runner", "document_semantic_inspection_runner", "SYSTEM_ROOT_FOLDER_ID", "AllowAllIdentityAdapter", "TestIdentityAdapter"]

[workspace.boundaries.work_domain]
crate_path = "crates/work-domain"
forbidden_dependencies = ["sqlx", "axum", "tokio", "document-server", "organization-server"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.work_application]
crate_path = "crates/work-application"
forbidden_dependencies = ["sqlx", "axum", "document-server", "organization-server"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.work_api_http]
crate_path = "crates/work-api-http"
forbidden_dependencies = ["sqlx", "work-repository-postgres", "document-server", "organization-server"]
forbidden_source_patterns = ["work_repository_postgres", "document_repository_postgres", "AllowAllIdentityAdapter"]

[workspace.boundaries.search_core]
crate_path = "crates/search-core"
forbidden_dependencies = ["sqlx", "axum", "tokio", "tantivy", "search-tantivy", "reqwest"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.search_application]
crate_path = "crates/search-application"
forbidden_dependencies = ["sqlx", "axum", "tantivy", "search-tantivy", "reqwest"]
forbidden_source_patterns = ["std::fs", "std::path", "tokio::fs"]

[workspace.boundaries.search_api_http]
crate_path = "crates/search-api-http"
forbidden_dependencies = ["sqlx", "tantivy", "search-tantivy", "search-source-document", "search-source-http", "search-runtime", "document-api-http", "reqwest"]
forbidden_source_patterns = ["std::fs", "tokio::fs", "AllowAllIdentityAdapter"]

[workspace.boundaries.search_source_http]
crate_path = "crates/search-source-http"
forbidden_dependencies = ["sqlx", "axum", "tantivy", "search-tantivy", "search-source-document", "search-runtime"]
forbidden_source_patterns = ["std::fs", "tokio::fs"]

[workspace.boundaries.search_tantivy]
crate_path = "crates/search-tantivy"
forbidden_dependencies = ["sqlx", "axum", "lindera", "lindera-tantivy"]
forbidden_source_patterns = ["tokio::fs"]

[workspace.boundaries.audit_store_postgres]
crate_path = "crates/audit-store-postgres"
forbidden_dependencies = ["axum", "outbox-delivery", "organization-server", "document-api-http", "document-application", "document-diff-core", "document-diff-runner", "document-diff-worker", "document-domain", "document-publication-scheduler", "document-repository-postgres", "document-sandbox-runner", "document-semantic-inspection-core", "document-semantic-inspection-runner", "document-semantic-inspection-worker", "document-server", "document-storage-fs", "search-api-http", "search-application", "search-core", "search-evaluation", "search-extraction-core", "search-extraction-runner", "search-extraction-worker", "search-graph", "search-graph-memory", "search-projection-memory", "search-runtime", "search-source-document", "search-source-http", "search-tantivy", "search-vector-adapter", "work-api-http", "work-application", "work-domain", "work-repository-postgres"]
