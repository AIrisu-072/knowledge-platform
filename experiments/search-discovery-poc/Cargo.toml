[workspace]
members = ["."]
resolver = "3"

[package]
name = "search-discovery-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "=0.26.2"
tempfile = "3"
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic"] }
lindera-analysis = { version = "=6.2.0", default-features = false }
