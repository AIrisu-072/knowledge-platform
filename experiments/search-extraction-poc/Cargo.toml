[workspace]
members = ["."]
resolver = "3"

[package]
name = "search-extraction-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "extraction-qualify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
encoding_rs = "=0.8.41"
csv = "=1.4.0"
html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"
unicode-normalization = "0.1"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "=0.45.0", default-features = false }
libc = "0.2"
