[workspace]
members = ["."]
resolver = "3"

[package]
name = "document-semantic-inspection-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
hex = "0.4"

encoding_rs = "=0.8.41"

csv = "=1.4.0"

html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"

unicode-normalization = "0.1"

url = "2"

docxml = "=0.3.1"

zip = "8"

quick-xml = "0.42"

[dev-dependencies]
tempfile = "3"
