[workspace]
members = ["."]
resolver = "3"

[package]
name = "document-semantic-inspection-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
hex = "0.4"

encoding_rs = "=0.8.41"

csv = "=1.4.0"

html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"

unicode-normalization = "0.1"

url = "2"

office_oxide = "=0.1.11"

zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

quick-xml = "=0.42.0"

rxls = "=0.1.3"
calamine = { version = "=0.36.1", features = ["picture"] }
ovba = "=0.7.1"
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.8"

pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "=0.45.0", default-features = false }

xml-sec = "=0.1.16"
cms = { version = "=0.2.3", features = ["std", "sha2", "signature"] }
der = "=0.7.10"
x509-cert = "=0.2.5"
openssl = { version = "=0.10.81", features = ["vendored"] }


[build-dependencies]
cc = "=1.2.41"

[dev-dependencies]
cfb = "=0.10.0"
tempfile = "3"
