[graph]
all-features = false

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "libloading"
version = "0.9.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "ring"
version = "0.17.14"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
version = "0.9.0"
allow = ["ISC"]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Exact Phase4 qualification-only exceptions; requires inventory role gate.

[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
