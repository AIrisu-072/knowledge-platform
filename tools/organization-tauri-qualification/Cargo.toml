edition = "2024"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[dependencies]
tauri = { version = "=2.12.1", default-features = false, features = ["wry", "custom-protocol", "common-controls-v6"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", default-features = false }
