[package]
name = "desktop-proxy-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Tests the actual desktop proxy source without resolving the native UI stack.
# This is not a Tauri/WebView or desktop packaging qualification.
[workspace]

[dependencies]
http = "=1.5.0"
reqwest = { version = "=0.13.5", default-features = false }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt", "time", "net"] }
url = "=2.5.8"
