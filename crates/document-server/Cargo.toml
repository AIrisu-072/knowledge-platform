[package]
name = "document-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "matched-path"] }
document-api-http = { version = "0.0.0", path = "../document-api-http" }
document-application = { version = "0.0.0", path = "../document-application" }
document-domain = { version = "0.0.0", path = "../document-domain" }
document-repository-postgres = { version = "0.0.0", path = "../document-repository-postgres" }
uuid.workspace = true
document-diff-core = { version = "0.0.0", path = "../document-diff-core" }
document-diff-runner = { version = "0.0.0", path = "../document-diff-runner" }
document-semantic-inspection-core = { version = "0.0.0", path = "../document-semantic-inspection-core" }
document-semantic-inspection-runner = { version = "0.0.0", path = "../document-semantic-inspection-runner" }
document-storage-fs = { version = "0.0.0", path = "../document-storage-fs" }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", default-features = false, features = ["fs"] }
percent-encoding = "=2.3.2"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
html5ever.workspace = true
markup5ever_rcdom.workspace = true
sha2.workspace = true
tempfile.workspace = true
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
testcontainers.workspace = true
http-body = "=1.1.0"
