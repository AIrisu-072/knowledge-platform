[package]
name = "audit-acceptance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test-only acceptance of Audit Infrastructure v1 (unit C): real Document producers through the relay into the Audit Store"

# No production code: the library is empty and every dependency is a
# dev-dependency of the acceptance tests in tests/acceptance.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[dev-dependencies]
audit-core = { version = "0.0.0", path = "../audit-core" }
audit-relay = { version = "0.0.0", path = "../audit-relay" }
audit-store-postgres = { version = "0.0.0", path = "../audit-store-postgres" }
outbox-delivery = { version = "0.0.0", path = "../outbox-delivery" }
document-application = { version = "0.0.0", path = "../document-application" }
document-diff-core = { version = "0.0.0", path = "../document-diff-core" }
document-domain = { version = "0.0.0", path = "../document-domain" }
document-publication-scheduler = { version = "0.0.0", path = "../document-publication-scheduler" }
document-repository-postgres = { version = "0.0.0", path = "../document-repository-postgres" }
document-semantic-inspection-core = { version = "0.0.0", path = "../document-semantic-inspection-core" }
document-storage-fs = { version = "0.0.0", path = "../document-storage-fs" }
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
