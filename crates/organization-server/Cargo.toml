[package]
name = "organization-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "matched-path"] }
document-server = { version = "0.0.0", path = "../document-server" }
document-api-http = { version = "0.0.0", path = "../document-api-http" }
document-application = { version = "0.0.0", path = "../document-application" }
document-domain = { version = "0.0.0", path = "../document-domain" }
document-repository-postgres = { version = "0.0.0", path = "../document-repository-postgres" }
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tower = "=0.5.3"

work-domain = { version = "0.0.0", path = "../work-domain" }
work-application = { version = "0.0.0", path = "../work-application" }
work-repository-postgres = { version = "0.0.0", path = "../work-repository-postgres" }
work-api-http = { version = "0.0.0", path = "../work-api-http" }

[dev-dependencies]
