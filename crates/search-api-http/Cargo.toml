[package]
name = "search-api-http"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "matched-path"] }
http-body = "=1.1.0"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
search-application = { version = "0.0.0", path = "../search-application" }
search-core = { version = "0.0.0", path = "../search-core" }
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["net"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid.workspace = true
