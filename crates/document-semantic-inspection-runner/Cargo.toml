[package]
name = "document-semantic-inspection-runner"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
document-semantic-inspection-core = { version = "0.0.0", path = "../document-semantic-inspection-core" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[[bin]]
name = "dsi-runner-hostile-worker"
path = "tests/support/hostile_worker.rs"
test = false
bench = false

[[test]]
name = "runner_baseline"
path = "tests/runner_baseline.rs"

[[test]]
name = "runner_isolation"
path = "tests/runner_isolation.rs"
