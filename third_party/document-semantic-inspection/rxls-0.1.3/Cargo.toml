[[example]]
name = "robustness"
path = "examples/robustness.rs"

[[example]]
name = "roundtrip"
path = "examples/roundtrip.rs"
required-features = ["xlsx"]

[[example]]
name = "to_xlsx"
path = "examples/to_xlsx.rs"
