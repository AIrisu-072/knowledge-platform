[package.metadata.docs.rs]
all-features = true

[features]
chrono = ["dep:chrono"]
cli = []
default = [
    "xlsx",
    "cli",
]
full = [
    "xlsx",
    "xlsb",
    "ods",
    "serde",
    "chrono",
]
ods = [
    "dep:zip",
    "dep:quick-xml",
]
serde = ["dep:serde"]
xlsb = ["xlsx"]
xlsx = [
    "dep:zip",
    "dep:quick-xml",
]

[lib]
name = "rxls"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "rxls"
path = "src/main.rs"
