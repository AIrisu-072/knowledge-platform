[workspace]
members = [
  "crates/document-domain",
  "crates/document-application",
  "crates/document-semantic-inspection-core",
  "crates/document-semantic-inspection-worker",
  "crates/document-storage-fs",
  "crates/document-repository-postgres",
  "tools/architecture-lint",
  "tools/assurance",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "json", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.11"
time = { version = "0.3", features = ["serde"] }
tempfile = "3"
testcontainers = "0.28"
encoding_rs = "=0.8.41"
unicode-normalization = "=0.1.25"
csv = "=1.4.0"
html5ever = "=0.39.0"
markup5ever_rcdom = "=0.39.0"
office_oxide = "=0.1.11"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
png = { version = "=0.18.1", default-features = false }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "=0.45.0", default-features = false }
rxls = "=0.1.3"
calamine = { version = "=0.36.1", features = ["picture"] }
ovba = "=0.7.1"
cfb = "=0.10.0"
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.8"
cc = "=1.2.41"
xml-sec = "=0.1.16"
cms = { version = "=0.2.3", features = ["std", "sha2", "signature"] }
x509-cert = "=0.2.5"
openssl = { version = "=0.10.81", features = ["vendored"] }

[patch.crates-io]
# Task 6: exact ovba 0.7.1 source with bounded decode and strict dir consumption.
# Source provenance and the scoped hardening diff are recorded under third_party.
ovba = { path = "third_party/document-semantic-inspection/ovba-0.7.1" }
