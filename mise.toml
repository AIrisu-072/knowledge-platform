[settings]
jobs = 1

[tools]
rust = "1.98.1"
node = "24.21.0"
pnpm = "12.4.1"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-nextest" = "0.9.144"
"cargo:sqlx-cli" = "0.9.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:google/osv-scanner" = { version = "2.5.1", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
"github:anchore/syft" = "1.51.1"
"github:rhysd/actionlint" = "1.7.12"
"github:zizmorcore/zizmor" = "1.29.0"

[env]
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"

[tasks.bootstrap]
description = "Install locked tools, dependencies, and local git hooks"
run = [
  "mise install rust",
  "rustup component add --toolchain 1.98.1 rustfmt clippy",
  "mise install node",
  "mise install pnpm",
  "mise install cargo:cargo-deny",
  "mise install cargo:cargo-nextest",
  "mise install cargo:sqlx-cli",
  "mise install github:gitleaks/gitleaks",
  "mise install github:google/osv-scanner",
  "mise install github:anchore/syft",
  "mise install github:rhysd/actionlint",
  "mise install github:zizmorcore/zizmor",
  "pnpm install --frozen-lockfile",
  "git config core.hooksPath .githooks",
]

[tasks.fmt]
description = "Check source formatting"
run = ["cargo fmt --all -- --check"]

[tasks."check:rust"]
description = "Run Rust static checks"
run = [
  "cargo check --workspace --locked",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo clippy -p search-source-http --all-targets --locked --features synthetic-loopback-test-only -- -D warnings",
  "cargo clippy -p search-runtime --all-targets --locked --features synthetic-loopback-test-only -- -D warnings",
]

[tasks."test:rust"]
description = "Run Rust tests"
run = '''
set -eu
if [ "$(uname -s)" = Linux ]; then
  cargo build --locked -p document-semantic-inspection-worker --bin document-semantic-inspection-worker
  cargo build --locked -p document-diff-worker --bin document-diff-worker
  export DSI_WORKER_BIN="$(realpath "${CARGO_TARGET_DIR:-target}/debug/document-semantic-inspection-worker")"
  export DIFF_WORKER_BIN="$(realpath "${CARGO_TARGET_DIR:-target}/debug/document-diff-worker")"
fi
cargo nextest run --workspace
cargo nextest run -p search-source-http --features synthetic-loopback-test-only
cargo nextest run -p search-runtime --features synthetic-loopback-test-only --test server_e2e
'''

[tasks."sqlx:prepare"]
description = "Generate SQLx offline metadata against disposable PostgreSQL 18.6"
run = '''
set -eu
container="knowledge-platform-sqlx-prepare-${GITHUB_RUN_ID:-local}-$$-$(date +%s)"
cleanup() {
  docker rm -f "$container" >/dev/null 2>&1 || true
}
trap cleanup EXIT INT TERM
docker run -d --name "$container" \
  -e POSTGRES_USER=postgres \
  -e POSTGRES_PASSWORD=postgres \
  -e POSTGRES_DB=knowledge_platform_sqlx \
  -p 127.0.0.1::5432 \
  postgres:18.6-bookworm >/dev/null
ready=0
i=0
while [ "$i" -lt 60 ]; do
  if docker exec "$container" pg_isready -U postgres -d knowledge_platform_sqlx >/dev/null 2>&1; then
    ready=1
    break
  fi
  i=$((i + 1))
  sleep 1
done
if [ "$ready" -ne 1 ]; then
  docker logs "$container" >&2
  exit 1
fi
host_port="$(docker port "$container" 5432/tcp | sed -n '1s/.*://p')"
test -n "$host_port"
export DATABASE_URL="postgres://postgres:postgres@127.0.0.1:${host_port}/knowledge_platform_sqlx"
cargo sqlx migrate run --source crates/document-repository-postgres/migrations
cargo sqlx prepare --workspace -- --all-targets
'''

[tasks."sqlx:check"]
description = "Verify committed SQLx offline metadata against disposable PostgreSQL 18.6"
run = '''
set -eu
container="knowledge-platform-sqlx-check-${GITHUB_RUN_ID:-local}-$$-$(date +%s)"
cleanup() {
  docker rm -f "$container" >/dev/null 2>&1 || true
}
trap cleanup EXIT INT TERM
docker run -d --name "$container" \
  -e POSTGRES_USER=postgres \
  -e POSTGRES_PASSWORD=postgres \
  -e POSTGRES_DB=knowledge_platform_sqlx \
  -p 127.0.0.1::5432 \
  postgres:18.6-bookworm >/dev/null
ready=0
i=0
while [ "$i" -lt 60 ]; do
  if docker exec "$container" pg_isready -U postgres -d knowledge_platform_sqlx >/dev/null 2>&1; then
    ready=1
    break
  fi
  i=$((i + 1))
  sleep 1
done
if [ "$ready" -ne 1 ]; then
  docker logs "$container" >&2
  exit 1
fi
host_port="$(docker port "$container" 5432/tcp | sed -n '1s/.*://p')"
test -n "$host_port"
export DATABASE_URL="postgres://postgres:postgres@127.0.0.1:${host_port}/knowledge_platform_sqlx"
cargo sqlx migrate run --source crates/document-repository-postgres/migrations
cargo sqlx prepare --check --workspace -- --all-targets
'''

[tasks."api:check"]
description = "Validate the OpenAPI contract"
run = ["pnpm api:lint", "pnpm api:contract"]

[tasks."arch:check"]
description = "Run machine-enforced architecture policy"
run = ["cargo run --quiet --locked -p architecture-lint -- check"]

[tasks."arch:negative-smoke"]
description = "Prove architecture policy rejects representative contract violations"
run = '''
set -eu
ci='.github/workflows/ci.yml'
backup="$(mktemp)"
cp "$ci" "$backup"
cleanup() {
  cp "$backup" "$ci"
  rm -f "$backup" Dockerfile.prod .github/workflows/bypass-smoke.yml
}
trap cleanup EXIT
expect_arch_failure() {
  if cargo run --quiet --locked -p architecture-lint -- check >/tmp/arch-negative.out 2>&1; then
    cat /tmp/arch-negative.out >&2
    echo 'architecture negative smoke unexpectedly passed' >&2
    exit 1
  fi
}
python3 - <<'PY'
from pathlib import Path
p = Path('.github/workflows/ci.yml')
s = p.read_text()
p.write_text(s.replace('runs-on: ubuntu-24.04', 'runs-on: self-hosted', 1))
PY
expect_arch_failure
cp "$backup" "$ci"
python3 - <<'PY'
from pathlib import Path
p = Path('.github/workflows/ci.yml')
s = p.read_text()
p.write_text(s.replace('runs-on: ubuntu-24.04', 'runs-on: windows-latest', 1))
PY
expect_arch_failure
cp "$backup" "$ci"
printf 'FROM scratch\n' > Dockerfile.prod
expect_arch_failure
rm Dockerfile.prod
cat > .github/workflows/bypass-smoke.yml <<'YAML'
name: bypass smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bypass:
    runs-on: ubuntu-24.04
    steps:
      - run: echo bypass
YAML
expect_arch_failure
'''

[tasks."repo:policy"]
description = "Verify prohibited names and generated/sensitive artifacts are not tracked"
run = '''
set -eu
jp="$(printf '\343\201\227\343\201\256\343\201\256\343\202\201')"
en='Shino''nome'
if git grep -n -I -F "$jp" -- .; then
  echo 'prohibited institution-name match found' >&2
  exit 1
fi
if git grep -n -I -F "$en" -- .; then
  echo 'prohibited institution-name match found' >&2
  exit 1
fi
if git ls-files | grep -E '(^|/)(target/|node_modules/|dist/|coverage/|tmp/)|(^|/)\.env($|\.)|\.(pem|key|p12|pfx|db|sqlite|sqlite3)$'; then
  echo 'generated or sensitive artifact is tracked' >&2
  exit 1
fi
'''

[tasks."assure:scan"]
description = "Extract normative assurance requirements"
run = ["cargo run --quiet --locked -p assurance-cli -- scan"]

[tasks."assure:plan"]
description = "Compile assurance impact plan"
run = ["cargo run --quiet --locked -p assurance-cli -- plan --all"]

[tasks."assure:run"]
description = "Run planned assurance capabilities"
run = ["cargo run --quiet --locked -p assurance-cli -- run --all"]

[tasks."assure:report"]
description = "Render assurance evidence and gaps"
run = ["cargo run --quiet --locked -p assurance-cli -- report"]

[tasks."security:secrets:self-test"]
description = "Verify the pinned Gitleaks binary detects a synthetic non-live PAT-shaped fixture"
run = '''
set -eu
tmpdir="$(mktemp -d)"
trap 'rm -rf "$tmpdir"' EXIT
prefix='ghp_'
part1='wA9mK2pLxN4vRtQzY6'
part2='bC8dEfGhJlM0oPq1rS'
printf 'token = "%s%s%s"\n' "$prefix" "$part1" "$part2" > "$tmpdir/repro.txt"
set +e
gitleaks dir --redact --exit-code 42 "$tmpdir"
status=$?
set -e
test "$status" -eq 42
'''

[tasks."security:secrets"]
description = "Scan Git history for secrets"
run = ["gitleaks git --redact --exit-code 1"]

[tasks."security:deps"]
description = "Check dependency licenses, sources, advisories, and vulnerabilities"
run = [
  "cargo deny check",
  "osv-scanner scan source -r .",
]

[tasks."ci:lint"]
description = "Lint GitHub Actions syntax and security"
run = [
  "actionlint",
  "zizmor .github/workflows",
]

[tasks.security]
description = "Run supply-chain and workflow policy gates"
depends = ["security:secrets:self-test", "security:secrets", "security:deps", "ci:lint"]

[tasks."hook:pre-commit"]
description = "Fast staged pre-commit checks"
run = [
  "gitleaks git --staged --redact --exit-code 1",
  "cargo fmt --all -- --check",
  "mise run arch:check",
]

[tasks."hook:pre-push"]
description = "Fast pre-push checks"
run = [
  "gitleaks git --redact --exit-code 1",
  "mise run verify:fast",
]

[tasks."portability:macos"]
description = "macOS portability smoke check"
run = [
  "cargo check --workspace --locked",
  "pnpm install --frozen-lockfile",
  "pnpm api:lint",
]

[tasks."container:verify"]
description = "Build and smoke-test canonical linux/amd64 bootstrap OCI image"
run = [
  "docker buildx build --platform linux/amd64 --target bootstrap-tools --load -t knowledge-platform-bootstrap:local .",
  "docker run --rm knowledge-platform-bootstrap:local --help",
]

[tasks.sbom]
description = "Generate CycloneDX and SPDX SBOMs for the local bootstrap image"
depends = ["container:verify"]
run = [
  "mkdir -p target",
  "syft knowledge-platform-bootstrap:local -o cyclonedx-json=target/sbom.cdx.json",
  "syft knowledge-platform-bootstrap:local -o spdx-json=target/sbom.spdx.json",
]

[tasks."verify:fast"]
description = "Fast local feedback gate"
depends = ["fmt", "check:rust", "arch:check", "api:check", "test:rust"]

[tasks.verify]
description = "Standard pre-PR verification gate"
depends = ["verify:fast", "security"]

[tasks."verify:full"]
description = "Full reproducibility/integration gate"
depends = ["verify", "sbom"]


[tasks."poc:search:test"]
run = ["cargo test --locked --manifest-path experiments/search-discovery-poc/Cargo.toml"]

[tasks."eval:search"]
description = "Run synthetic Search Discovery stage and safety evaluation fixtures"
run = ["cargo test --locked -p search-evaluation --test scenarios -- --test-threads=1 --nocapture"]

[tasks."poc:search:deny"]
run = ["cargo deny --manifest-path experiments/search-discovery-poc/Cargo.toml --config experiments/search-discovery-poc/deny.toml check"]

[tasks."poc:search:verify"]
run = [
  "cargo test --locked --manifest-path experiments/search-discovery-poc/Cargo.toml",
  "cargo run --locked --manifest-path experiments/search-discovery-poc/Cargo.toml --bin search-discovery-poc -- verify",
  "cargo deny --manifest-path experiments/search-discovery-poc/Cargo.toml --config experiments/search-discovery-poc/deny.toml check",
  "cargo run --locked --manifest-path experiments/search-discovery-poc/Cargo.toml --bin search-discovery-poc -- report --format json > experiments/search-discovery-poc/target/qualification.json",
]

[tasks."poc:search-graph:qualify"]
description = "Measure one P3 Graph backend/profile (BACKEND, PROFILE, PG_REF, NEO_REF) on a dedicated runner"
run = "bash experiments/search-graph-poc/qualify.sh"

[tasks."poc:dsi:test"]
run = ["cargo test --locked --manifest-path experiments/document-semantic-inspection/Cargo.toml"]

[tasks."poc:dsi:run"]
run = ["cargo run --locked --manifest-path experiments/document-semantic-inspection/Cargo.toml --bin dsi-poc -- verify"]

[tasks."poc:dsi:deny"]
run = ["cargo deny --manifest-path experiments/document-semantic-inspection/Cargo.toml --config experiments/document-semantic-inspection/deny.toml check"]

[tasks."poc:dsi:verify"]
run = [
  "rm -rf experiments/document-semantic-inspection/target/dsi-poc/gates && mkdir -p experiments/document-semantic-inspection/target/dsi-poc/gates",
  "cargo test --locked --manifest-path experiments/document-semantic-inspection/Cargo.toml",
  "printf 'pass\\n' > experiments/document-semantic-inspection/target/dsi-poc/gates/runtime-security.ok",
  "cargo run --locked --manifest-path experiments/document-semantic-inspection/Cargo.toml --bin dsi-poc -- verify",
  "cargo deny --manifest-path experiments/document-semantic-inspection/Cargo.toml --config experiments/document-semantic-inspection/deny.toml check",
  "printf 'pass\\n' > experiments/document-semantic-inspection/target/dsi-poc/gates/license-dependency.ok",
  "cargo run --locked --manifest-path experiments/document-semantic-inspection/Cargo.toml --bin dsi-poc -- report --format json > experiments/document-semantic-inspection/target/dsi-poc/final.json",
  "cat experiments/document-semantic-inspection/target/dsi-poc/final.json",
]


[tasks."poc:dsi:sandbox-test"]
description = "Run Document Semantic Inspection Task 1 sandbox contract"
run = ["cargo test --locked --manifest-path experiments/document-semantic-inspection-sandbox/Cargo.toml"]

[tasks."poc:dsi:sandbox-deny"]
description = "Check Document Semantic Inspection sandbox candidate dependency policy"
run = ["cargo deny --manifest-path experiments/document-semantic-inspection-sandbox/Cargo.toml --config experiments/document-semantic-inspection-sandbox/deny.toml check"]

[tasks."poc:dsi:sandbox-verify"]
description = "Run Document Semantic Inspection Task 1 sandbox preflight"
depends = ["poc:dsi:sandbox-test", "poc:dsi:sandbox-deny"]


[tasks."document:preview:qualify"]
description = "Qualify the production-build preview and unchanged mock GUI contracts"
run = [
  "pnpm --filter @knowledge-platform/document-web test:preview",
  "pnpm --filter @knowledge-platform/document-web test",
  "pnpm --filter @knowledge-platform/document-web e2e",
]

[tasks."desktop:bridge:e2e"]
description = "Browser E2E of the desktop runtime adapter against the real local Workspace broker (TEST-ONLY stdio bridge; not Tauri/WebView2/Windows proof)"
run = [
  "cargo build --locked -p local-workspace-runtime --example stdio_bridge",
  "pnpm --filter @knowledge-platform/document-web build",
  "pnpm --filter @knowledge-platform/document-web exec tsc -p tsconfig.desktop-bridge.json",
  "pnpm --filter @knowledge-platform/document-web exec playwright test -c playwright.desktop-bridge.config.ts",
]

[tasks."document:poc:runtime"]
description = "Qualify the real two-process Document PoC runtime and same-origin GUI"
run = '''
set -eu
mise run document:preview:qualify
node --test tools/document-poc-runtime/test/*.test.mjs
pnpm --dir tools/document-poc-seed test
pnpm --filter @knowledge-platform/document-web exec tsc -p ../../tools/document-poc-runtime/tsconfig.json
if [ -z "${KP_DSI_PDFIUM_RUNTIME_DIR:-}" ]; then
  KP_DSI_PDFIUM_RUNTIME_DIR="$(bash experiments/document-semantic-inspection/scripts/install-pdfium.sh)"
  export KP_DSI_PDFIUM_RUNTIME_DIR
fi
node tools/document-poc-runtime/run.mjs
'''

[tasks."document:mcp:test"]
description = "Build and verify the exact read-only MCP tool adapter and actual stdio boundary"
run = ["pnpm --filter @knowledge-platform/document-mcp test"]

[tasks."document:poc:agent"]
description = "Qualify real Human GUI plus Agent MCP on the shared owned Document runtime"
depends = ["document:poc:runtime"]

[tasks."organization:poc:runtime"]
description = "Qualify the synthetic Organization database transaction and two-principal browser journey"
run = '''
set -eu
node --test tools/organization-poc-runtime/*.test.mjs
pnpm --filter @knowledge-platform/document-web exec tsc -p tsconfig.organization-runtime.json
if [ -z "${KP_DSI_PDFIUM_RUNTIME_DIR:-}" ]; then
  KP_DSI_PDFIUM_RUNTIME_DIR="$(bash experiments/document-semantic-inspection/scripts/install-pdfium.sh)"
  export KP_DSI_PDFIUM_RUNTIME_DIR
fi
node tools/organization-poc-runtime/run.mjs
'''

[tasks."document:scheduler:acceptance"]
description = "Qualify separate scheduler processes, current authorization and single publication"
run = '''
set -eu
cargo build --locked -p document-semantic-inspection-worker --bin document-semantic-inspection-worker
export DSI_WORKER_BIN="$(realpath "${CARGO_TARGET_DIR:-target}/debug/document-semantic-inspection-worker")"
cargo test --locked -p document-publication-scheduler --test linux_container_canary -- --ignored --test-threads=1
'''

[tasks."organization:d2:normal"]
description = "Qualify the bounded synthetic Organization D2 source without captures"
run = ["node tools/organization-d2/unit-check.mjs", "node tools/organization-d2/run.mjs normal"]

[tasks."organization:d2:capture"]
description = "Qualify and export the explicitly activated current D2 twenty-PNG review"
run = ["node tools/organization-d2/unit-check.mjs", "node tools/organization-d2/run.mjs capture"]
