[graph]
all-features = false

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "libloading"
version = "0.9.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "ring"
version = "0.17.14"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
version = "0.9.0"
allow = ["ISC"]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
