name: Bootstrap lock refresh

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/repository-bootstrap-v0
          fetch-depth: 0
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Refresh mise lock
        run: mise lock
      - name: Commit refreshed lock
        run: |
          set -eu
          if git diff --quiet -- mise.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mise.lock
          git commit -m 'chore: refresh mise lock [lock-refreshed]'
          git push origin HEAD:chore/repository-bootstrap-v0
