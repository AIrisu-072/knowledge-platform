name: Bootstrap materialization

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-materialized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
      - name: Add approved requirement metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spec/architecture/development-container-ci-architecture-v0.md')
          text = path.read_text(encoding='utf-8')
          blocks = {
              '## 6. mise as development task SSOT': '''## 6. mise as development task SSOT\n\n```requirement\nid = "REQ-DEV-MISE-TASK-SSOT"\nkind = "architecture"\ncriticality = "medium"\ndomain = "development"\n```''',
              '## 11. Canonical production artifact': '''## 11. Canonical production artifact\n\n```requirement\nid = "REQ-DEV-PRODUCTION-LINUX-AMD64"\nkind = "architecture"\ncriticality = "medium"\ndomain = "development"\n```''',
              '## 17. CI runner policy': '''## 17. CI runner policy\n\n```requirement\nid = "REQ-DEV-GITHUB-HOSTED-CI"\nkind = "architecture"\ncriticality = "medium"\ndomain = "development"\n```''',
          }
          for heading, replacement in blocks.items():
              if replacement not in text:
                  if heading not in text:
                      raise SystemExit(f'missing heading: {heading}')
                  text = text.replace(heading, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Generate Rust lockfile
        run: cargo generate-lockfile
      - name: Generate pnpm lockfile
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
          pnpm install --lockfile-only
      - name: Generate mise lockfile
        run: mise lock
      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock pnpm-lock.yaml mise.lock spec/architecture/development-container-ci-architecture-v0.md
          git diff --cached --check
          git commit -m "chore: materialize bootstrap metadata and lockfiles [bootstrap-materialized]"
          git push origin HEAD:chore/repository-bootstrap-v0
