name: Task 5 RED SQL safety

on:
  push:
    branches:
      - feat/document-authoritative-core-v0

permissions:
  contents: write

jobs:
  normalize-sql:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust
        run: |
          mise install rust
          rustup component add --toolchain 1.98.1 rustfmt
      - name: Replace dynamic test SQL with audited static literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/document-repository-postgres/tests/repository_contract.rs')
          s = p.read_text()
          start = s.index('        let trigger_sql = format!(')
          end = s.index('\n\n        let ids =', start)
          s = s[:start] + '        install_failure_trigger(&pool, table).await;' + s[end:]
          start = s.index('        let drop_trigger_sql = format!(')
          end = s.index('\n\n        assert_attempt_rows_zero(', start)
          s = s[:start] + '        drop_failure_trigger(&pool, table).await;' + s[end:]
          start = s.index('async fn count_where_uuid(')
          end = s.index('\n\nasync fn assert_attempt_rows_zero(', start)
          replacement = '''async fn count_where_uuid(pool: &PgPool, table: &str, column: &str, id: Uuid) -> i64 {
              match (table, column) {
                  ("documents", "document_id") => count_literal(pool, "SELECT count(*) FROM documents WHERE document_id = $1", id).await,
                  ("document_versions", "document_version_id") => count_literal(pool, "SELECT count(*) FROM document_versions WHERE document_version_id = $1", id).await,
                  ("file_objects", "file_id") => count_literal(pool, "SELECT count(*) FROM file_objects WHERE file_id = $1", id).await,
                  ("version_files", "document_version_id") => count_literal(pool, "SELECT count(*) FROM version_files WHERE document_version_id = $1", id).await,
                  ("outbox_events", "aggregate_id") => count_literal(pool, "SELECT count(*) FROM outbox_events WHERE aggregate_id = $1", id).await,
                  ("audit_outbox_events", "resource_id") => count_literal(pool, "SELECT count(*) FROM audit_outbox_events WHERE resource_id = $1", id).await,
                  _ => panic!("unsupported fixed count target: {table}.{column}"),
              }
          }

          async fn count_literal(pool: &PgPool, sql: &'static str, id: Uuid) -> i64 {
              sqlx::query_scalar(sql)
                  .bind(id)
                  .fetch_one(pool)
                  .await
                  .expect("fixed count query should succeed")
          }

          async fn install_failure_trigger(pool: &PgPool, table: &str) {
              let sql = match table {
                  "documents" => "CREATE TRIGGER kp_fail BEFORE INSERT ON documents FOR EACH STATEMENT EXECUTE FUNCTION kp_fail_insert()",
                  "document_versions" => "CREATE TRIGGER kp_fail BEFORE INSERT ON document_versions FOR EACH STATEMENT EXECUTE FUNCTION kp_fail_insert()",
                  "version_files" => "CREATE TRIGGER kp_fail BEFORE INSERT ON version_files FOR EACH STATEMENT EXECUTE FUNCTION kp_fail_insert()",
                  "outbox_events" => "CREATE TRIGGER kp_fail BEFORE INSERT ON outbox_events FOR EACH STATEMENT EXECUTE FUNCTION kp_fail_insert()",
                  "audit_outbox_events" => "CREATE TRIGGER kp_fail BEFORE INSERT ON audit_outbox_events FOR EACH STATEMENT EXECUTE FUNCTION kp_fail_insert()",
                  _ => panic!("unsupported fixed trigger target: {table}"),
              };
              sqlx::query(sql)
                  .execute(pool)
                  .await
                  .unwrap_or_else(|error| panic!("trigger on {table} should install: {error}"));
          }

          async fn drop_failure_trigger(pool: &PgPool, table: &str) {
              let sql = match table {
                  "documents" => "DROP TRIGGER kp_fail ON documents",
                  "document_versions" => "DROP TRIGGER kp_fail ON document_versions",
                  "version_files" => "DROP TRIGGER kp_fail ON version_files",
                  "outbox_events" => "DROP TRIGGER kp_fail ON outbox_events",
                  "audit_outbox_events" => "DROP TRIGGER kp_fail ON audit_outbox_events",
                  _ => panic!("unsupported fixed trigger target: {table}"),
              };
              sqlx::query(sql)
                  .execute(pool)
                  .await
                  .unwrap_or_else(|error| panic!("trigger on {table} should drop: {error}"));
          }'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/document-repository-postgres/tests/repository_contract.rs
          git commit -m 'test: use static SQL in postgres repository contract'
          git push origin HEAD:${GITHUB_REF_NAME}
