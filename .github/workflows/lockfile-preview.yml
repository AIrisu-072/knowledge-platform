name: Cargo Lock Preview

on:
  pull_request:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "0"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust
        run: mise install rust
      - name: Verify repository policy through project entrypoint
        run: mise run repo:policy
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Upload lockfile preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lock-preview
          path: Cargo.lock
          retention-days: 1
          if-no-files-found: error
