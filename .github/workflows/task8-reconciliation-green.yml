name: task8-reconciliation-green

on:
  push:
    branches:
      - feat/document-authoritative-core-v0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/document-authoritative-core-v0
          fetch-depth: 0
      - name: Patch reconciliation bidirectional detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/document-application/src/ports.rs",
              "    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError>;\n}",
              "    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError>;\n\n    async fn list_referenced_file_ids(&self) -> Result<Vec<FileId>, RepositoryError>;\n}",
          )

          Path("crates/document-application/src/reconciliation.rs").write_text('''use document_domain::FileId;\nuse time::{Duration, OffsetDateTime};\n\nuse crate::{StorageObjectInfo, StorageObjectKind};\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ReconciliationClassification {\n    Healthy,\n    StaleStaging,\n    Orphan,\n    IntegrityViolation,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ReconciliationFinding {\n    file_id: FileId,\n    object: Option<StorageObjectInfo>,\n    classification: ReconciliationClassification,\n}\n\nimpl ReconciliationFinding {\n    pub(crate) fn new(\n        file_id: FileId,\n        object: Option<StorageObjectInfo>,\n        classification: ReconciliationClassification,\n    ) -> Self {\n        Self {\n            file_id,\n            object,\n            classification,\n        }\n    }\n\n    pub const fn file_id(&self) -> FileId {\n        self.file_id\n    }\n\n    pub const fn object(&self) -> Option<&StorageObjectInfo> {\n        self.object.as_ref()\n    }\n\n    pub const fn classification(&self) -> ReconciliationClassification {\n        self.classification\n    }\n}\n\npub fn classify(\n    db_referenced: bool,\n    object: Option<&StorageObjectInfo>,\n    now: OffsetDateTime,\n    grace: Duration,\n) -> Option<ReconciliationClassification> {\n    match (db_referenced, object) {\n        (true, Some(object)) if object.kind() == StorageObjectKind::Final => {\n            Some(ReconciliationClassification::Healthy)\n        }\n        (true, _) => Some(ReconciliationClassification::IntegrityViolation),\n        (false, Some(object)) if now - object.modified_at() >= grace => match object.kind() {\n            StorageObjectKind::Staging => Some(ReconciliationClassification::StaleStaging),\n            StorageObjectKind::Final => Some(ReconciliationClassification::Orphan),\n            StorageObjectKind::Unknown => None,\n        },\n        (false, _) => None,\n    }\n}\n''')

          service = Path("crates/document-application/src/service.rs")
          text = service.read_text()
          text = text.replace("use std::sync::Arc;", "use std::{collections::HashSet, sync::Arc};", 1)
          text = text.replace(
              "    DomainEventRecord, FileStorage, IdGenerator, ReconciliationFinding, StoreFileRequest, classify,\n};",
              "    DomainEventRecord, FileStorage, IdGenerator, ReconciliationFinding, StorageObjectKind,\n    StoreFileRequest, classify,\n};",
              1,
          )
          old = '''    pub async fn reconcile_storage(\n        &self,\n        grace: Duration,\n    ) -> Result<Vec<ReconciliationFinding>, ApplicationError> {\n        let now = self.clock.now();\n        let objects = self.storage.list_objects().await?;\n        let mut findings = Vec::new();\n\n        for object in objects {\n            let Some(file_id) = object.file_id() else {\n                continue;\n            };\n            let db_referenced = self.repository.file_reference_exists(file_id).await?;\n            if let Some(classification) = classify(db_referenced, Some(&object), now, grace) {\n                findings.push(ReconciliationFinding::new(object, classification));\n            }\n        }\n\n        Ok(findings)\n    }\n'''
          new = '''    pub async fn reconcile_storage(\n        &self,\n        grace: Duration,\n    ) -> Result<Vec<ReconciliationFinding>, ApplicationError> {\n        let now = self.clock.now();\n        let objects = self.storage.list_objects().await?;\n        let referenced_ids = self.repository.list_referenced_file_ids().await?;\n        let referenced: HashSet<FileId> = referenced_ids.iter().copied().collect();\n        let mut findings = Vec::new();\n\n        for file_id in referenced_ids {\n            let final_object = objects\n                .iter()\n                .find(|object| {\n                    object.kind() == StorageObjectKind::Final && object.file_id() == Some(file_id)\n                })\n                .cloned();\n            let classification = classify(true, final_object.as_ref(), now, grace)\n                .expect("referenced files always have a reconciliation classification");\n            findings.push(ReconciliationFinding::new(\n                file_id,\n                final_object,\n                classification,\n            ));\n        }\n\n        for object in objects {\n            let Some(file_id) = object.file_id() else {\n                continue;\n            };\n            if object.kind() == StorageObjectKind::Final && referenced.contains(&file_id) {\n                continue;\n            }\n            if let Some(classification) = classify(false, Some(&object), now, grace) {\n                findings.push(ReconciliationFinding::new(\n                    file_id,\n                    Some(object),\n                    classification,\n                ));\n            }\n        }\n\n        Ok(findings)\n    }\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("service reconciliation anchor missing")
              text = text.replace(old, new, 1)
          service.write_text(text)

          repo = Path("crates/document-repository-postgres/src/repository.rs")
          text = repo.read_text()
          old = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        sqlx::query_scalar("SELECT EXISTS (SELECT 1 FROM version_files WHERE file_id = $1)")\n            .bind(file_id.as_uuid())\n            .fetch_one(&self.pool)\n            .await\n            .map_err(map_statement_error)\n    }\n}\n'''
          new = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        sqlx::query_scalar("SELECT EXISTS (SELECT 1 FROM version_files WHERE file_id = $1)")\n            .bind(file_id.as_uuid())\n            .fetch_one(&self.pool)\n            .await\n            .map_err(map_statement_error)\n    }\n\n    async fn list_referenced_file_ids(&self) -> Result<Vec<FileId>, RepositoryError> {\n        let ids: Vec<uuid::Uuid> =\n            sqlx::query_scalar("SELECT DISTINCT file_id FROM version_files ORDER BY file_id")\n                .fetch_all(&self.pool)\n                .await\n                .map_err(map_statement_error)?;\n        Ok(ids.into_iter().map(FileId::from_uuid).collect())\n    }\n}\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("repository anchor missing")
              text = text.replace(old, new, 1)
          repo.write_text(text)

          contract = Path("crates/document-application/tests/create_document_contract.rs")
          text = contract.read_text()
          old = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        Ok(self\n            .state\n            .lock()\n            .unwrap()\n            .document\n            .as_ref()\n            .is_some_and(|document| document.file().file_id() == file_id))\n    }\n}\n'''
          new = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        Ok(self\n            .state\n            .lock()\n            .unwrap()\n            .document\n            .as_ref()\n            .is_some_and(|document| document.file().file_id() == file_id))\n    }\n\n    async fn list_referenced_file_ids(&self) -> Result<Vec<FileId>, RepositoryError> {\n        Ok(self\n            .state\n            .lock()\n            .unwrap()\n            .document\n            .as_ref()\n            .map(|document| vec![document.file().file_id()])\n            .unwrap_or_default())\n    }\n}\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("fake repository anchor missing")
              text = text.replace(old, new, 1)
          text = text.replace(
              "    assert_eq!(findings[0].object().file_id(), Some(expected_file_id));",
              "    assert_eq!(findings[0].file_id(), expected_file_id);\n    assert_eq!(\n        findings[0].object().and_then(StorageObjectInfo::file_id),\n        Some(expected_file_id)\n    );",
              1,
          )
          contract.write_text(text)

          detection = Path("crates/document-application/tests/reconciliation_detection.rs")
          text = detection.read_text()
          old = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        Ok(file_id == self.file_id)\n    }\n}\n'''
          new = '''    async fn file_reference_exists(&self, file_id: FileId) -> Result<bool, RepositoryError> {\n        Ok(file_id == self.file_id)\n    }\n\n    async fn list_referenced_file_ids(&self) -> Result<Vec<FileId>, RepositoryError> {\n        Ok(vec![self.file_id])\n    }\n}\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("regression fake anchor missing")
              text = text.replace(old, new, 1)
          detection.write_text(text)
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/document-application crates/document-repository-postgres
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: reconcile missing authoritative files"
          git push origin HEAD:feat/document-authoritative-core-v0
