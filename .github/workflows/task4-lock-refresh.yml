name: Task 4 lock refresh

on:
  push:
    branches:
      - feat/document-authoritative-core-v0

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust
        run: mise install rust
      - name: Refresh Cargo lockfile
        run: |
          set -eu
          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh lockfile for storage tests'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify architecture entrypoint
        run: mise run arch:check
