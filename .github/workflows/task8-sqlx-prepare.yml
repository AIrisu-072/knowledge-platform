name: Task 8 SQLx prepare

on:
  push:
    branches:
      - feat/document-authoritative-core-v0

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust and SQLx CLI
        run: |
          mise install rust
          mise install cargo:sqlx-cli
      - name: Refresh tool lock and prepare SQLx metadata
        run: |
          set -eu
          mise lock
          mise run sqlx:prepare
          echo '--- SQLx metadata ---'
          if [ -d .sqlx ]; then
            find .sqlx -maxdepth 1 -type f -print | sort
          else
            echo '.sqlx directory was not generated'
          fi
          git status --short
      - name: Commit generated reproducibility metadata
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mise.lock Cargo.lock
          if [ -d .sqlx ]; then
            git add -A .sqlx
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: generate sqlx reproducibility metadata'
          git push origin HEAD:${GITHUB_REF_NAME}
