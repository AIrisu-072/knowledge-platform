name: patch bootstrap plan pin

on:
  push:
    branches:
      - docs/architecture-bootstrap-v0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize corrected plan blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          source_sha = '605277da0c3c16bac16e21157a0870da22b1aabe'
          expected_sha = '3f91275446f74f3172b61eadaf583d3ed0c245a4'
          expected_sha256 = 'e01a88ac581885890408f641c0db316a8548a5bc0978c48b16481b409222290b'
          old = b'"github:gitleaks/gitleaks" = "8.31.0"'
          new = b'"github:gitleaks/gitleaks" = "8.30.1"'

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{source_sha}',
              headers=headers,
          )
          with urllib.request.urlopen(req) as response:
              src = json.load(response)
          data = base64.b64decode(src['content'])
          if data.count(old) != 1 or new in data:
              raise SystemExit('unexpected source plan contents')
          data = data.replace(old, new)

          blob_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          digest = hashlib.sha256(data).hexdigest()
          if blob_sha != expected_sha:
              raise SystemExit(f'git blob mismatch: {blob_sha}')
          if digest != expected_sha256:
              raise SystemExit(f'sha256 mismatch: {digest}')

          payload = json.dumps({
              'content': base64.b64encode(data).decode('ascii'),
              'encoding': 'base64',
          }).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs',
              data=payload,
              method='POST',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          if result['sha'] != expected_sha:
              raise SystemExit(f'uploaded blob mismatch: {result["sha"]}')
          print(result['sha'])
          PY
