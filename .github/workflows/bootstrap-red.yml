name: Bootstrap RED

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: read

jobs:
  architecture-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
      - name: RED architecture policy tests
        run: cargo test -p architecture-lint --test policy
