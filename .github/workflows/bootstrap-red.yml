name: Bootstrap TDD

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: read

jobs:
  assurance-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
      - name: Architecture regression
        run: cargo test -p architecture-lint --test policy
      - name: Assurance tests
        run: |
          cargo test -p assurance-cli --test requirements
          cargo test -p assurance-cli --test graph
          cargo test -p assurance-cli --test plan
          cargo test -p assurance-cli --test provider
