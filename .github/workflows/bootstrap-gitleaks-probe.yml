name: Gitleaks pin probe

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find newest Gitleaks version that detects canonical synthetic PAT
        run: |
          set -eu
          root=/tmp/gitleaks-probe
          repo="$root/repo"
          mkdir -p "$repo"
          cd "$repo"
          git init -q
          git config user.name probe
          git config user.email probe@example.invalid
          printf '%s\n' 'token = "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"' > synthetic.txt
          git add synthetic.txt

          printf '%-8s %-8s %-8s\n' VERSION STAGED DIR
          for version in 8.30.1 8.30.0 8.29.1 8.29.0 8.28.0; do
            dir="$root/$version"
            mkdir -p "$dir"
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              | tar -xz -C "$dir" gitleaks
            set +e
            "$dir/gitleaks" git --staged --redact --exit-code 1 . >"$root/${version}.staged" 2>&1
            staged=$?
            "$dir/gitleaks" dir --redact --exit-code 1 . >"$root/${version}.dir" 2>&1
            direct=$?
            set -e
            printf '%-8s %-8s %-8s\n' "$version" "$staged" "$direct"
            if [ "$staged" -eq 1 ] && [ "$direct" -eq 1 ]; then
              echo "$version" > "$root/newest-good"
              break
            fi
          done
          test -s "$root/newest-good"
          echo "newest-good=$(cat "$root/newest-good")"
