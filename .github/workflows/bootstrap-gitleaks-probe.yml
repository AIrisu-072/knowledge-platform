name: Gitleaks pin probe

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Gitleaks 8.30.1 with non-stopword synthetic PAT
        run: |
          set -eu
          root=/tmp/gitleaks-probe
          repo="$root/repo"
          mkdir -p "$repo" "$root/bin"
          cd "$repo"
          git init -q
          git config user.name probe
          git config user.email probe@example.invalid
          printf '%s\n' 'token = "ghp_wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS"' > synthetic.txt
          git add synthetic.txt
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$root/bin" gitleaks
          set +e
          "$root/bin/gitleaks" git --staged --redact --exit-code 1 . >"$root/staged.out" 2>&1
          staged=$?
          "$root/bin/gitleaks" dir --redact --exit-code 1 . >"$root/dir.out" 2>&1
          direct=$?
          set -e
          echo "gitleaks=8.30.1 staged=$staged dir=$direct"
          test "$staged" -eq 1
          test "$direct" -eq 1
          ! grep -F 'ghp_wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS' "$root/staged.out"
          ! grep -F 'ghp_wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS' "$root/dir.out"
