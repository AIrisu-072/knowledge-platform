name: task8-commit-outcome-green

on:
  push:
    branches:
      - feat/document-authoritative-core-v0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/document-authoritative-core-v0
          fetch-depth: 0
      - name: Patch ambiguous create identity propagation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/document-application/src/error.rs",
              "use document_domain::DomainError;",
              "use document_domain::{DocumentId, DocumentVersionId, DomainError, FileId};",
          )
          replace_once(
              "crates/document-application/src/error.rs",
              '''    #[error("commit outcome is unknown")]\n    CommitOutcomeUnknown,\n''',
              '''    #[error("commit outcome is unknown")]\n    CommitOutcomeUnknown {\n        document_id: DocumentId,\n        document_version_id: DocumentVersionId,\n        file_id: FileId,\n    },\n''',
          )
          replace_once(
              "crates/document-application/src/error.rs",
              "            RepositoryError::CommitOutcomeUnknown => Self::CommitOutcomeUnknown,",
              '''            RepositoryError::CommitOutcomeUnknown => Self::Internal(\n                "commit outcome unknown outside create operation identity context".to_owned(),\n            ),''',
          )

          service = Path("crates/document-application/src/service.rs")
          text = service.read_text()
          text = text.replace(
              "    DomainEventRecord, FileStorage, IdGenerator, ReconciliationFinding, StorageObjectKind,\n    StoreFileRequest, classify,",
              "    DomainEventRecord, FileStorage, IdGenerator, ReconciliationFinding, RepositoryError,\n    StorageObjectKind, StoreFileRequest, classify,",
              1,
          )
          old = '''        self.repository\n            .create_initial_document(CreateInitialDocumentRecord::new(\n                authoritative,\n                domain_events,\n                audit_events,\n            ))\n            .await?;\n\n        Ok(CreateDocumentResult::new(\n            document_id,\n            document_version_id,\n            file_id,\n        ))\n'''
          new = '''        let record = CreateInitialDocumentRecord::new(authoritative, domain_events, audit_events);\n        match self.repository.create_initial_document(record).await {\n            Ok(()) => Ok(CreateDocumentResult::new(\n                document_id,\n                document_version_id,\n                file_id,\n            )),\n            Err(RepositoryError::CommitOutcomeUnknown) => {\n                Err(ApplicationError::CommitOutcomeUnknown {\n                    document_id,\n                    document_version_id,\n                    file_id,\n                })\n            }\n            Err(error) => Err(error.into()),\n        }\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("service create anchor missing")
              text = text.replace(old, new, 1)
          service.write_text(text)

          contract = Path("crates/document-application/tests/create_document_contract.rs")
          text = contract.read_text()
          text = text.replace(
              "    assert_eq!(error, ApplicationError::CommitOutcomeUnknown);\n    assert!(storage.is_finalized());",
              '''    assert!(matches!(\n        error,\n        ApplicationError::CommitOutcomeUnknown { .. }\n    ));\n    assert!(storage.is_finalized());''',
              1,
          )
          old = '''    let service = service(storage.clone(), repository.clone());\n    let known_document_id = DocumentId::from_uuid(Uuid::from_u128(1));\n\n    let error = service.create_document(command()).await.unwrap_err();\n    assert_eq!(error, ApplicationError::CommitOutcomeUnknown);\n    assert!(storage.is_finalized());\n\n    let recovered = service\n        .lookup_create_outcome(known_document_id)\n'''
          new = '''    let service = service(storage.clone(), repository.clone());\n\n    let error = service.create_document(command()).await.unwrap_err();\n    let known_document_id = match error {\n        ApplicationError::CommitOutcomeUnknown { document_id, .. } => document_id,\n        other => panic!("expected ambiguous create identity, got {other:?}"),\n    };\n    assert!(storage.is_finalized());\n\n    let recovered = service\n        .lookup_create_outcome(known_document_id)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("persisted ambiguous test anchor missing")
              text = text.replace(old, new, 1)
          old = '''    let create_service = service(storage.clone(), repository.clone());\n    let known_document_id = DocumentId::from_uuid(Uuid::from_u128(1));\n    let expected_file_id = FileId::from_uuid(Uuid::from_u128(3));\n    let grace = Duration::hours(1);\n\n    let error = create_service.create_document(command()).await.unwrap_err();\n    assert_eq!(error, ApplicationError::CommitOutcomeUnknown);\n    assert!(storage.is_finalized());\n'''
          new = '''    let create_service = service(storage.clone(), repository.clone());\n    let grace = Duration::hours(1);\n\n    let error = create_service.create_document(command()).await.unwrap_err();\n    let (known_document_id, expected_file_id) = match error {\n        ApplicationError::CommitOutcomeUnknown {\n            document_id, file_id, ..\n        } => (document_id, file_id),\n        other => panic!("expected ambiguous create identity, got {other:?}"),\n    };\n    assert!(storage.is_finalized());\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("orphan ambiguous test anchor missing")
              text = text.replace(old, new, 1)
          contract.write_text(text)
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/document-application
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: expose ambiguous create operation identity"
          git push origin HEAD:feat/document-authoritative-core-v0
