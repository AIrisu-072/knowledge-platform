name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - chore/repository-bootstrap-v0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "0"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install policy runtimes
        run: |
          mise install rust
          mise install node
          mise install pnpm
          pnpm install --frozen-lockfile
      - run: mise run arch:check
      - run: mise run arch:negative-smoke
      - run: mise run repo:policy
      - run: mise run api:check
      - run: mise run assure:scan
      - run: mise run assure:plan
      - run: mise run assure:run
      - run: mise run assure:report

  rust-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust static-analysis toolchain
        run: |
          mise install rust
          rustup component add --toolchain 1.98.1 rustfmt clippy
          mise install cargo:sqlx-cli
      - run: mise run fmt
      - run: mise run check:rust
      - run: mise run sqlx:check

  rust-test:
    runs-on: ubuntu-24.04
    # The workspace test build plus the feature-gated E2E rebuild exhausted
    # the runner disk; debug info and incremental state are not needed here.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install Rust test tools sequentially
        run: |
          mise install rust
          mise install cargo:cargo-nextest
      - name: Install pinned PDFium for worker tests
        run: |
          pdfium_lib_dir="$(bash experiments/document-semantic-inspection/scripts/install-pdfium.sh)"
          printf 'PDFIUM_DYNAMIC_LIB_PATH=%s\n' "${pdfium_lib_dir}" >> "${GITHUB_ENV}"
      - run: mise run test:rust

  search-process-recovery:
    name: Search 復旧・監視・Source登録・世代guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: 固定Rustと公式PostgreSQLを準備
        run: |
          mise install rust
          docker pull postgres:18.6-bookworm
          docker image inspect postgres:18.6-bookworm --format '{{index .RepoDigests 0}}'
          git rev-parse HEAD 'HEAD^{tree}'
          rustc --version
      - name: Domainの新規・既存履歴と旧Search9停止を確認
        run: cargo test --locked -p document-repository-postgres --test search_main_migration --test outbox_delivery_migration -- --test-threads=1 --nocapture
      - name: 最終試行の異常終了を一度だけ回収
        run: cargo test --locked -p outbox-delivery --test process_recovery last_claim_kill9_restart_reaps_unknown_once -- --exact --nocapture
      - name: 4プロセスの非重複と停止分の再取得
        run: cargo test --locked -p outbox-delivery --test process_recovery four_processes_disjoint_claims_and_recover_expired -- --exact --nocapture
      - name: G08の観測・トレース・配送ロールと既存Runnerを確認
        run: cargo test --locked -p outbox-delivery --lib --test runner_admission --test runner_lifecycle --test runner_observation --test observability_security -- --test-threads=1 --nocapture
      - name: P7のSource登録・lease・世代guardと既存スキーマを確認
        run: cargo test --locked -p search-runtime --lib --test source_registration --test source_lease --test full_guard --test source_ownership_migration --test coordination_migration --test generation_schema -- --test-threads=1 --nocapture
      - name: 非公開handleの構築を拒否する型の境界
        run: cargo test --locked -p search-runtime --doc

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install security tools sequentially
        run: |
          mise install rust
          mise install cargo:cargo-deny
          mise install github:gitleaks/gitleaks
          mise install github:google/osv-scanner
          mise install github:rhysd/actionlint
          mise install github:zizmorcore/zizmor
      - run: mise run security

  portability-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install portability runtimes
        run: |
          mise install rust
          mise install node
          mise install pnpm
      - run: mise run portability:macos

  dsi-semantic-parity-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - run: mise install rust
      - name: Install pinned PDFium for DSI semantic parity
        run: |
          pdfium_lib_dir="$(bash experiments/document-semantic-inspection/scripts/install-pdfium.sh)"
          printf 'PDFIUM_DYNAMIC_LIB_PATH=%s\n' "${pdfium_lib_dir}" >> "${GITHUB_ENV}"
      - name: DSI 91-case parity and supplemental semantic gates
        run: |
          cargo test --locked -p document-semantic-inspection-worker \
            --test poc_production_parity \
            --test xlsm_vba_semantics \
            --test vba_resource_bounds \
            --test signature_contract \
            --test signature_cli_trust_fd

  container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install SBOM tool
        run: mise install github:anchore/syft
      - run: mise run sbom

  document-poc-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install pinned runtime and frontend dependencies
        run: |
          mise install rust
          mise install node
          mise install pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Document qualification contracts
        run: pnpm --dir tools/document-load-qualification test
      - name: Install verified Japanese runner font
        run: node tools/document-poc-runtime/runner-font.mjs
      - name: Install pinned Chromium
        run: pnpm --filter @knowledge-platform/document-web exec playwright install chromium
      - name: Check current PR43 visual review event
        id: visual-review-gate
        run: node tools/document-poc-runtime/visual-review-gate.mjs
      - name: Real composition-root acceptance
        env:
          KP_POC_VISUAL_REVIEW_ENABLED: ${{ steps.visual-review-gate.outputs.enabled }}
          KP_DOCUMENT_LOAD_RECEIPT_ALLOWED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo != null && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'document-load-small') }}
          KP_DOCUMENT_LOAD_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          KP_DOCUMENT_LOAD_REQUESTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'document-load-small') }}
        run: |
          unset KP_DOCUMENT_LOAD_SMALL KP_DOCUMENT_LOAD_PLAN KP_DOCUMENT_LOAD_THOUSAND
          if [[ "$KP_DOCUMENT_LOAD_REQUESTED" == "true" ]]; then
            export KP_DOCUMENT_LOAD_SMALL=true
          fi
          unset KP_POC_CAPTURE_VISUAL
          if [[ "$KP_POC_VISUAL_REVIEW_ENABLED" == "true" ]]; then
            export KP_POC_CAPTURE_VISUAL=true
          fi
          mise run document:poc:agent
      - name: Real Organization two-principal acceptance
        run: mise run organization:poc:runtime
      - name: Emit bounded runtime evidence
        if: ${{ always() }}
        run: node tools/document-poc-runtime/ci-summary.mjs
      - name: Upload bounded Document small qualification receipt
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo != null && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'document-load-small') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing pin; one synthetic receipt only
        with:
          name: document-load-small-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          include-hidden-files: true
          path: tools/document-poc-runtime/.state/document-load-export/qualification.json
      - name: Upload approved synthetic PR43 review pixels
        id: visual-review-upload
        if: ${{ success() && steps.visual-review-gate.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; pin-specific ADR
        with:
          name: document-c3-review43-${{ steps.visual-review-gate.outputs.head }}-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          # The private .state ancestor requires this; only the 13 literal regular
          # PNGs from successful owned-runtime validation are selected.
          include-hidden-files: true
          path: |
            tools/document-poc-runtime/.state/visual-export/01-list-context-1440.png
            tools/document-poc-runtime/.state/visual-export/02-list-focus-return-1280.png
            tools/document-poc-runtime/.state/visual-export/03-detail-overview-1440.png
            tools/document-poc-runtime/.state/visual-export/04-revision-version-1440.png
            tools/document-poc-runtime/.state/visual-export/05-comparison-1440.png
            tools/document-poc-runtime/.state/visual-export/06-version-file-selected-1440.png
            tools/document-poc-runtime/.state/visual-export/07-publication-ready-1440.png
            tools/document-poc-runtime/.state/visual-export/08-publication-confirm-focus-1440.png
            tools/document-poc-runtime/.state/visual-export/09-publication-success-1440.png
            tools/document-poc-runtime/.state/visual-export/10-access-policy-effective-draft-1440.png
            tools/document-poc-runtime/.state/visual-export/11-occ-conflict-1440.png
            tools/document-poc-runtime/.state/visual-export/12-permission-denied-file-retained-1440.png
            tools/document-poc-runtime/.state/visual-export/13-permission-restored-retry-success-1440.png

  document-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install pinned Node and workspace dependencies
        run: |
          mise install node
          mise install pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - run: mise run document:mcp:test

  document-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install pinned Rust toolchain
        run: mise install rust
      - name: Install pinned PDFium for scheduler worker
        run: |
          pdfium_lib_dir="$(bash experiments/document-semantic-inspection/scripts/install-pdfium.sh)"
          printf 'PDFIUM_DYNAMIC_LIB_PATH=%s\n' "${pdfium_lib_dir}" >> "${GITHUB_ENV}"
      - name: Real separate-process scheduler acceptance
        run: mise run document:scheduler:acceptance

  desktop-runtime-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - name: Install pinned runtime and frontend dependencies
        run: |
          mise install rust
          mise install node
          mise install pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Chromium
        run: pnpm --filter @knowledge-platform/document-web exec playwright install chromium
      - name: Desktop adapter against the real local Workspace broker
        run: mise run desktop:bridge:e2e

  required-check:
    if: ${{ always() }}
    needs:
      - policy
      - rust-static
      - rust-test
      - search-process-recovery
      - security
      - portability-macos
      - dsi-semantic-parity-macos
      - container-build
      - document-poc-runtime
      - document-mcp
      - document-scheduler
      - desktop-runtime-bridge
    runs-on: ubuntu-24.04
    steps:
      - name: Require every predecessor
        env:
          POLICY: ${{ needs.policy.result }}
          RUST_STATIC: ${{ needs.rust-static.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          SEARCH_PROCESS_RECOVERY: ${{ needs.search-process-recovery.result }}
          SECURITY: ${{ needs.security.result }}
          PORTABILITY_MACOS: ${{ needs.portability-macos.result }}
          DSI_SEMANTIC_PARITY_MACOS: ${{ needs.dsi-semantic-parity-macos.result }}
          CONTAINER_BUILD: ${{ needs.container-build.result }}
          DOCUMENT_POC_RUNTIME: ${{ needs.document-poc-runtime.result }}
          DOCUMENT_MCP: ${{ needs.document-mcp.result }}
          DOCUMENT_SCHEDULER: ${{ needs.document-scheduler.result }}
          DESKTOP_RUNTIME_BRIDGE: ${{ needs.desktop-runtime-bridge.result }}
        run: |
          set -eu
          for result in "$POLICY" "$RUST_STATIC" "$RUST_TEST" "$SEARCH_PROCESS_RECOVERY" "$SECURITY" "$PORTABILITY_MACOS" "$DSI_SEMANTIC_PARITY_MACOS" "$CONTAINER_BUILD" "$DOCUMENT_POC_RUNTIME" "$DOCUMENT_MCP" "$DOCUMENT_SCHEDULER" "$DESKTOP_RUNTIME_BRIDGE"; do
            test "$result" = success
          done
