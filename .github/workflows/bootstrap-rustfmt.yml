name: Bootstrap rustfmt

on:
  push:
    branches:
      - chore/repository-bootstrap-v0

permissions:
  contents: write

env:
  MISE_AUTO_INSTALL: "0"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/repository-bootstrap-v0
          fetch-depth: 0
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          install: false
      - run: |
          mise install rust
          rustup component add --toolchain 1.98.1 rustfmt clippy
      - run: cargo fmt --all
      - name: Commit rustfmt result
        run: |
          set -eu
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools
          git commit -m 'style: apply rustfmt [rustfmt]'
          git push origin HEAD:chore/repository-bootstrap-v0
