name: materialize normative import blobs

on:
  push:
    branches:
      - docs/architecture-bootstrap-v0

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify normative files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat .import/plan/*.part > /tmp/plan.md
          cat .import/lib/*.part > /tmp/library.md
          test "$(git hash-object /tmp/plan.md)" = "605277da0c3c16bac16e21157a0870da22b1aabe"
          test "$(git hash-object /tmp/library.md)" = "a648073e806dd9cd0f84920ca8a6bc5f1212c902"
          test "$(sha256sum /tmp/plan.md | awk '{print $1}')" = "9a19dedbb89b00427ce4c3e7e9a4f293d380e84881630c08c0b158a9973a9cca"
          test "$(sha256sum /tmp/library.md | awk '{print $1}')" = "1412a9c0ac352072d1ef49eb0f2e8d3f7a2096082aa09bf6499f615efffd6291"
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          files = [
              ('/tmp/plan.md', '605277da0c3c16bac16e21157a0870da22b1aabe'),
              ('/tmp/library.md', 'a648073e806dd9cd0f84920ca8a6bc5f1212c902'),
          ]
          for path, expected in files:
              with open(path, 'rb') as f:
                  content = base64.b64encode(f.read()).decode('ascii')
              payload = json.dumps({'content': content, 'encoding': 'base64'}).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              actual = result['sha']
              if actual != expected:
                  raise SystemExit(f'blob SHA mismatch for {path}: {actual} != {expected}')
              print(f'{path}: {actual}')
          PY
