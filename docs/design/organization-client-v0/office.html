<!doctype html>
<html lang="ja" data-archetype="queue">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Client · 事務型 · Source Design</title><link rel="stylesheet" href="prototype.css"></head>
<body>
<a class="skip" href="#work-surface">主作業へ移動</a>
<div class="review-bar" aria-label="Source Design検証コントロール"><strong>Source Design · 合成データ</strong><a href="sales.html">営業型</a><a href="office.html">事務型</a><label for="scenario">状態<select id="scenario"></select></label><small>設計デモ：サーバー・Agent・ローカルファイルへの操作は行いません</small></div>
<header><div class="brand"><span>O</span>Organization Client</div><span class="subtle">タスク</span><div class="identity"><strong id="responsibility"></strong><span id="principal"></span> · 合成Identity</div></header>
<div class="shell">
<nav class="global-nav" aria-label="メインナビゲーション"><a href="#tasks" data-primary="tasks" aria-current="page">タスク</a><a href="#documents" data-primary="documents">文書</a><a href="#search" data-primary="search">検索</a><p class="nav-caption">現在の環境</p><p class="local-note">デスクトップが主環境<br>同じReactをブラウザーでも使用</p></nav>
<aside class="collection" id="task-collection" aria-label="タスク一覧"><div class="pane-heading"><p class="eyebrow" id="archetype-label"></p><h2 id="collection-title"></h2><span class="subtle">現在の責任で閲覧できる範囲</span></div><div class="collection-controls"><label for="collection-filter" class="subtle">表示対象<select id="collection-filter"><option>自分の担当</option><option>担当可能なタスク</option></select></label></div><div class="collection-list" id="collection-list"></div><div class="collection-foot" id="collection-foot"></div></aside>
<main class="work" id="work-surface" aria-label="主作業" tabindex="-1"><div class="work-heading"><div class="breadcrumb" id="breadcrumb"></div><h1 id="work-title"></h1><div class="meta"><span id="work-kind"></span><span>期限 2026/10/05 17:00 Asia/Tokyo（UTC+09:00）</span></div><ol class="steps"><li>受付</li><li class="current">内容確認</li><li class="future">審査</li><li class="future">承認</li></ol></div><div class="attention"><span class="status" id="attention-label"></span><p id="state-description"></p></div><div class="work-body" id="work-body"></div><footer class="actions" id="action-surface" aria-label="業務操作"><button type="button" id="hold-action">保留</button><button type="button" id="return-action">差戻</button><button type="button" id="assignment-action">担当変更</button><button type="button" class="primary" id="submit-action">提出</button><span class="action-note">操作の確定はBackend応答後。設計デモでは状態プレビューのみ</span></footer></main>
<aside class="context" id="context-surface" aria-label="文脈情報"><div class="module-switch" aria-label="Context Modules"><button type="button" data-module="evidence" aria-pressed="true">根拠</button><button type="button" data-module="agent" aria-pressed="false">Agent</button><button type="button" data-module="document" aria-pressed="false">文書・比較</button><button type="button" data-module="search" aria-pressed="false">検索</button><button type="button" data-module="return" aria-pressed="false">差戻</button><button type="button" data-module="history" aria-pressed="false">履歴</button><button type="button" data-module="resources" aria-pressed="false">資料・Workspace</button></div><div class="context-body" id="context-body"></div></aside>
</div><div class="notice" id="notice" role="status" aria-live="polite"></div>
<dialog id="action-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="dialog-cancel">キャンセル</button><button type="button" class="primary" id="dialog-confirm">状態プレビューへ</button></div></dialog>
<script src="scenarios.js"></script><script src="prototype.js"></script>
</body></html>
